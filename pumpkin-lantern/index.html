<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

/* ------------------------------------------------------------------ *
 *  Noise helpers (CPU)
 * ------------------------------------------------------------------ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash3i(x, y, z, s) {
  let h = Math.imul(x, 0x27d4eb2d) ^ Math.imul(y, 0x165667b1) ^ Math.imul(z, 0x9e3779b1) ^ Math.imul(s + 0x51ed27, 0x85ebca6b);
  h = Math.imul(h ^ (h >>> 15), 0x2c1b3c6d);
  h = Math.imul(h ^ (h >>> 12), 0x297a2d39);
  h ^= h >>> 15;
  return (h >>> 0) / 4294967296;
}
function vnoise3(x, y, z, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = hash3i(xi, yi, zi, s), b = hash3i(xi + 1, yi, zi, s);
  const c = hash3i(xi, yi + 1, zi, s), d = hash3i(xi + 1, yi + 1, zi, s);
  const e = hash3i(xi, yi, zi + 1, s), f = hash3i(xi + 1, yi, zi + 1, s);
  const g = hash3i(xi, yi + 1, zi + 1, s), h = hash3i(xi + 1, yi + 1, zi + 1, s);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (h - g) * u;
  const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
  return y1 + (y2 - y1) * w;
}
const noise1 = (t, s = 0) => vnoise3(t, 0.5, 0.5, s);

const GLSL_NOISE = /* glsl */`
  float pkH(vec3 p) { p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
  float pkNoise(vec3 x) {
    vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(pkH(i), pkH(i + vec3(1,0,0)), f.x), mix(pkH(i + vec3(0,1,0)), pkH(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(pkH(i + vec3(0,0,1)), pkH(i + vec3(1,0,1)), f.x), mix(pkH(i + vec3(0,1,1)), pkH(i + vec3(1,1,1)), f.x), f.y), f.z);
  }
`;

/* ------------------------------------------------------------------ *
 *  Renderer / scene / camera
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
let pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.03);
scene.fog.color.setRGB(0.012, 0.017, 0.028);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.05, 400);
camera.position.set(0.1, 0.95, 2.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.36, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;
controls.minDistance = 0.8;
controls.maxDistance = 3.4;
controls.minPolarAngle = 0.32;
controls.maxPolarAngle = 1.47;
controls.minAzimuthAngle = -1.7;
controls.maxAzimuthAngle = 1.7;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.update();

/* ------------------------------------------------------------------ *
 *  Lights
 * ------------------------------------------------------------------ */
const MOON_LIGHT_DIR = new V3(-0.64, 0.56, -0.53).normalize();
const MOON_SKY_DIR = new V3(-0.405, 0.075, -0.91).normalize();

const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 0.8);
hemi.color.setRGB(0.10, 0.13, 0.22);
hemi.groundColor.setRGB(0.035, 0.03, 0.028);
scene.add(hemi);

const moon = new THREE.DirectionalLight(0xffffff, 1.25);
moon.color.setRGB(0.52, 0.64, 1.0);
moon.position.copy(MOON_LIGHT_DIR).multiplyScalar(12);
moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3, near: 1, far: 30 });
moon.shadow.bias = -0.0004;
moon.shadow.normalBias = 0.012;
moon.shadow.radius = 2.5;
moon.shadow.autoUpdate = false;
moon.shadow.needsUpdate = true;
scene.add(moon, moon.target);

const CANDLE_COLOR = new THREE.Color().setRGB(1.0, 0.52, 0.18);
const candleLight = new THREE.PointLight(0xffffff, 0, 0, 1.0);
candleLight.color.copy(CANDLE_COLOR);
candleLight.castShadow = true;
candleLight.shadow.mapSize.set(1024, 1024);
candleLight.shadow.camera.near = 0.01;
candleLight.shadow.camera.far = 8;
candleLight.shadow.bias = -0.0015;
candleLight.shadow.radius = 2.6;
candleLight.shadow.autoUpdate = false;
scene.add(candleLight);

// cheap "bounce" lights standing in for light that escapes the holes and scatters off floor and wall
const bounceFront = new THREE.PointLight(0xffffff, 0, 1.6, 2);
bounceFront.color.setRGB(1.0, 0.5, 0.2);
const bounceBack = new THREE.PointLight(0xffffff, 0, 2.0, 2);
bounceBack.color.setRGB(1.0, 0.5, 0.2);
scene.add(bounceFront, bounceBack);

const doorLight = new THREE.SpotLight(0xffffff, 1.6, 0, 0.42, 0.9, 2);
doorLight.color.setRGB(1.0, 0.72, 0.45);
doorLight.position.set(2.1, 1.7, 1.5);
doorLight.target.position.set(-0.1, 0.15, -0.1);
doorLight.castShadow = true;
doorLight.shadow.mapSize.set(1024, 1024);
doorLight.shadow.camera.near = 0.5;
doorLight.shadow.camera.far = 8;
doorLight.shadow.bias = -0.0006;
doorLight.shadow.normalBias = 0.01;
doorLight.shadow.radius = 4;
doorLight.shadow.autoUpdate = false;
doorLight.shadow.needsUpdate = true;
scene.add(doorLight, doorLight.target);

/* ------------------------------------------------------------------ *
 *  Environment (for subtle reflections) + sky
 * ------------------------------------------------------------------ */
const SKY_FRAG = /* glsl */`
  uniform vec3 uMoonDir;
  uniform vec3 uLightDir;
  uniform float uTime;
  uniform float uEnv;
  varying vec3 vDir;
  ${GLSL_NOISE}
  void main() {
    vec3 d = normalize(vDir);
    float h = d.y;
    vec3 zen = vec3(0.0025, 0.0045, 0.012);
    vec3 hor = vec3(0.020, 0.028, 0.046);
    vec3 col = mix(hor, zen, smoothstep(-0.02, 0.55, h));
    col = mix(col, vec3(0.006, 0.006, 0.007), smoothstep(0.0, -0.25, h));
    vec3 md = uEnv > 0.5 ? uLightDir : uMoonDir;
    float m = max(dot(d, md), 0.0);
    col += vec3(0.10, 0.13, 0.20) * pow(m, 8.0) * 0.9;
    col += vec3(0.20, 0.24, 0.32) * pow(m, 80.0) * 0.8;
    if (uEnv > 0.5) {
      col += vec3(0.9, 0.95, 1.0) * smoothstep(0.9965, 0.999, m) * 6.0;
    } else {
      // moon disc with soft maria
      float disc = smoothstep(0.99955, 0.99968, m);
      vec3 t = normalize(cross(md, vec3(0.0, 1.0, 0.0)));
      vec3 b = cross(t, md);
      vec2 q = vec2(dot(d, t), dot(d, b)) * 40.0;
      float mar = pkNoise(vec3(q * 2.2, 1.0)) * 0.6 + pkNoise(vec3(q * 5.0, 3.0)) * 0.4;
      vec3 moonCol = vec3(1.0, 0.97, 0.9) * (1.15 - 0.45 * smoothstep(0.45, 0.75, mar));
      col = mix(col, moonCol * 2.6, disc);
      // stars
      if (h > 0.0) {
        vec3 p = d * 260.0;
        vec3 id = floor(p);
        float r = pkH(id);
        if (r > 0.9965) {
          vec3 c = id + 0.5 + (vec3(pkH(id + 7.1), pkH(id + 3.3), pkH(id + 1.9)) - 0.5) * 0.6;
          float s = 1.0 - smoothstep(0.0, 0.32, length(p - c));
          float tw = 0.6 + 0.4 * sin(uTime * (1.5 + r * 30.0) + r * 100.0);
          col += vec3(0.75, 0.82, 1.0) * s * tw * 0.55 * smoothstep(0.02, 0.3, h);
        }
      }
    }
    gl_FragColor = vec4(col, 1.0);
  }
`;
const SKY_VERT = /* glsl */`
  varying vec3 vDir;
  void main() {
    vDir = position;
    vec4 p = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    gl_Position = p.xyww;
  }
`;
const skyUniforms = { uMoonDir: { value: MOON_SKY_DIR }, uLightDir: { value: MOON_LIGHT_DIR }, uTime: { value: 0 }, uEnv: { value: 0 } };
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(300, 48, 24),
  new THREE.ShaderMaterial({ uniforms: skyUniforms, vertexShader: SKY_VERT, fragmentShader: SKY_FRAG, side: THREE.BackSide, depthWrite: false, fog: false })
);
sky.renderOrder = -10;
scene.add(sky);

{
  const envScene = new THREE.Scene();
  const envUniforms = { ...skyUniforms, uEnv: { value: 1 } };
  envScene.add(new THREE.Mesh(new THREE.SphereGeometry(10, 48, 24),
    new THREE.ShaderMaterial({ uniforms: envUniforms, vertexShader: SKY_VERT, fragmentShader: SKY_FRAG, side: THREE.BackSide, depthWrite: false })));
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.03).texture;
  pmrem.dispose();
}

/* ------------------------------------------------------------------ *
 *  Canvas texture helpers
 * ------------------------------------------------------------------ */
function makeCanvas(w, h, opts) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return [c, c.getContext('2d', opts)];
}
function canvasTex(canvas, srgb, repeat) {
  const t = new THREE.CanvasTexture(canvas);
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

/* ---------- porch floor: weathered boards running toward the wall ---------- */
function makeFloorTextures() {
  const W = 512, H = 1024, PW = 64;
  const [cc, cx] = makeCanvas(W, H);
  const [rc, rx] = makeCanvas(W, H);
  const ci = cx.createImageData(W, H), ri = rx.createImageData(W, H);
  const R = mulberry32(911);
  const planks = [];
  for (let p = 0; p < W / PW; p++) {
    const joints = [];
    let y = Math.floor(R() * 400);
    while (y < H) { joints.push(y); y += 380 + Math.floor(R() * 520); }
    planks.push({ joints, tone: [R(), R(), R(), R(), R(), R()] });
  }
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const pi = Math.floor(x / PW), lx = x % PW;
      const pl = planks[pi];
      let seg = 0, jd = 999;
      for (let k = 0; k < pl.joints.length; k++) {
        const d = y - pl.joints[k];
        if (d >= 0) seg = k + 1;
        jd = Math.min(jd, Math.abs(d), Math.abs(d + H), Math.abs(d - H));
      }
      const tone = pl.tone[seg % pl.tone.length];
      const s = pi * 13 + seg * 7;
      const gx = lx / PW;
      const warp = vnoise3(gx * 2, y * 0.004, s, 3) * 2.2;
      const grain = vnoise3(gx * 11 + warp, y * 0.0035, s * 1.7, 5);
      const fine = vnoise3(gx * 60, y * 0.03, s, 7);
      const blot = vnoise3(x * 0.012, y * 0.006, 1, 9);
      let t = 0.45 + (grain - 0.5) * 0.55 + (tone - 0.5) * 0.4 + (fine - 0.5) * 0.15 + (blot - 0.5) * 0.35;
      let r = lerp(58, 122, t), g = lerp(46, 100, t), b = lerp(38, 82, t);
      // grey weathering
      const wth = smooth(0.45, 0.75, blot) * 0.5;
      r = lerp(r, 112, wth); g = lerp(g, 108, wth); b = lerp(b, 102, wth);
      const edge = Math.min(lx, PW - 1 - lx);
      const gap = edge < 1.5 || jd < 1.2;
      const bevel = smooth(0, 4, edge) * smooth(0, 3, jd);
      if (gap) { r = 10; g = 8; b = 7; }
      else { const k = 0.72 + 0.28 * bevel; r *= k; g *= k; b *= k; }
      const o = (y * W + x) * 4;
      ci.data[o] = r; ci.data[o + 1] = g; ci.data[o + 2] = b; ci.data[o + 3] = 255;
      ri.data[o] = gap ? 0 : 150 + 70 * bevel + (grain - 0.5) * 60;
      ri.data[o + 1] = clamp(205 + (fine - 0.5) * 50 - wth * 20, 0, 255);
      ri.data[o + 2] = 0; ri.data[o + 3] = 255;
    }
  }
  cx.putImageData(ci, 0, 0); rx.putImageData(ri, 0, 0);
  return { map: canvasTex(cc, true, true), rb: canvasTex(rc, false, true) };
}

/* ---------- clapboard siding ---------- */
function makeSidingTextures() {
  const W = 1024, H = 1024, BH = 128;
  const [cc, cx] = makeCanvas(W, H);
  const [rc, rx] = makeCanvas(W, H);
  const ci = cx.createImageData(W, H), ri = rx.createImageData(W, H);
  const R = mulberry32(57);
  const joints = [];
  for (let k = 0; k < H / BH; k++) joints.push(Math.floor(R() * W));
  for (let y = 0; y < H; y++) {
    const row = Math.floor(y / BH), by = (y % BH) / BH;
    for (let x = 0; x < W; x++) {
      const stroke = vnoise3(x * 0.004, y * 0.09, row, 2);
      const stain = vnoise3(x * 0.03, y * 0.0025, 4, 4);
      const blot = vnoise3(x * 0.006, y * 0.006, 6, 6);
      const fine = vnoise3(x * 0.25, y * 0.25, 1, 8);
      let t = 0.55 + (stroke - 0.5) * 0.18 + (fine - 0.5) * 0.08 - smooth(0.55, 0.85, stain) * 0.18 - (blot - 0.5) * 0.2;
      const ao = 0.55 + 0.45 * smooth(0.0, 0.16, by);
      const lip = by > 0.94 ? 0.82 : 1;
      let jd = Math.abs(x - joints[row]); jd = Math.min(jd, W - jd);
      const joint = jd < 1.5 ? 0.45 : 1;
      const k = t * ao * lip * joint;
      const o = (y * W + x) * 4;
      ci.data[o] = 158 * k + 12; ci.data[o + 1] = 154 * k + 12; ci.data[o + 2] = 142 * k + 12; ci.data[o + 3] = 255;
      ri.data[o] = (60 + 170 * by + (stroke - 0.5) * 20) * (jd < 1.5 ? 0.6 : 1);
      ri.data[o + 1] = clamp(215 + (fine - 0.5) * 40, 0, 255);
      ri.data[o + 2] = 0; ri.data[o + 3] = 255;
    }
  }
  cx.putImageData(ci, 0, 0); rx.putImageData(ri, 0, 0);
  return { map: canvasTex(cc, true, true), rb: canvasTex(rc, false, true) };
}

/* ---------- pulp inside the pumpkin ---------- */
function makePulpTexture(seed) {
  const W = 1024, H = 512;
  const [c, x] = makeCanvas(W, H);
  const R = mulberry32(seed * 3 + 1);
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#d98a2e'); g.addColorStop(0.5, '#e9a447'); g.addColorStop(1, '#d4822a');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 260; i++) {
    const px = R() * W, py = R() * H, r = 10 + R() * 60;
    const gr = x.createRadialGradient(px, py, 0, px, py, r);
    const warm = R() < 0.5;
    gr.addColorStop(0, warm ? 'rgba(255,190,90,0.25)' : 'rgba(170,80,15,0.22)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = gr; x.fillRect(px - r, py - r, r * 2, r * 2);
  }
  // stringy fibres hanging along the meridians
  for (let i = 0; i < 1600; i++) {
    const px = R() * W, py = R() * H;
    const len = 20 + R() * 110, drift = (R() - 0.5) * 0.5;
    let cx0 = px, cy0 = py;
    x.beginPath(); x.moveTo(cx0, cy0);
    for (let k = 0; k < len; k += 3) { cx0 += drift + (R() - 0.5) * 1.6; cy0 += 3; x.lineTo(cx0, cy0); }
    const light = R() < 0.55;
    x.strokeStyle = light ? `rgba(255,${190 + R() * 40 | 0},${100 + R() * 50 | 0},${0.12 + R() * 0.22})` : `rgba(${140 + R() * 40 | 0},60,10,${0.1 + R() * 0.2})`;
    x.lineWidth = 0.4 + R() * 1.3;
    x.stroke();
  }
  // a few seeds left clinging to the wall
  for (let i = 0; i < 70; i++) {
    const px = R() * W, py = H * (0.25 + R() * 0.7), a = (R() - 0.5) * 1.2;
    for (const off of [0, -W, W]) {
      x.save(); x.translate(px + off, py); x.rotate(a);
      x.fillStyle = 'rgba(120,80,30,0.5)';
      x.beginPath(); x.ellipse(1.5, 1.5, 8, 4.4, 0, 0, TAU); x.fill();
      const sg = x.createLinearGradient(-8, 0, 8, 0);
      sg.addColorStop(0, '#efe0b8'); sg.addColorStop(1, '#d9c290');
      x.fillStyle = sg;
      x.beginPath(); x.ellipse(0, 0, 8, 4.2, 0, 0, TAU); x.fill();
      x.strokeStyle = 'rgba(160,120,60,0.6)'; x.lineWidth = 0.8; x.stroke();
      x.restore();
    }
  }
  return canvasTex(c, true, false);
}

/* ---------- leaves atlas (4 shapes x 2 colourways) ---------- */
function makeLeafAtlas() {
  const T = 256;
  const [c, x] = makeCanvas(T * 4, T * 2);
  const palettes = [
    ['#b8360f', '#e0661a', '#7a1f08'],
    ['#8a5a1f', '#c99a3a', '#5a3610'],
  ];
  const shapes = [
    a => 0.55 + 0.42 * Math.pow(Math.abs(Math.cos(2.5 * a)), 0.8) + 0.035 * Math.sin(a * 26),  // maple
    a => (0.62 + 0.14 * Math.sin(a * 7)) * (0.55 + 0.45 * Math.abs(Math.cos(a))),             // oak
    a => (0.88 * Math.abs(Math.cos(a)) + 0.36) * (1 + 0.03 * Math.sin(a * 40)) * 0.8,           // birch
    a => (0.92 * Math.pow(Math.abs(Math.cos(a)), 0.7) + 0.16) * 0.95,                           // willow-ish
  ];
  for (let row = 0; row < 2; row++) {
    for (let k = 0; k < 4; k++) {
      const [base, light, dark] = palettes[row];
      const cx0 = k * T + T / 2, cy0 = row * T + T / 2 + 6, S = T * 0.44;
      x.save();
      x.beginPath();
      for (let i = 0; i <= 200; i++) {
        const a = i / 200 * TAU;
        const r = shapes[k](a) * S;
        const sx = k === 2 || k === 3 ? 0.5 : 1;
        const px = cx0 + Math.sin(a) * r * sx, py = cy0 - Math.cos(a) * r;
        i ? x.lineTo(px, py) : x.moveTo(px, py);
      }
      x.closePath();
      const gr = x.createRadialGradient(cx0, cy0, 4, cx0, cy0, S);
      gr.addColorStop(0, light); gr.addColorStop(0.7, base); gr.addColorStop(1, dark);
      x.fillStyle = gr; x.fill();
      x.clip();
      for (let i = 0; i < 40; i++) {
        x.fillStyle = `rgba(40,20,5,${Math.random() * 0.12})`;
        x.beginPath(); x.arc(cx0 + (Math.random() - 0.5) * S * 1.6, cy0 + (Math.random() - 0.5) * S * 1.6, 2 + Math.random() * 10, 0, TAU); x.fill();
      }
      x.strokeStyle = 'rgba(60,25,5,0.55)'; x.lineWidth = 2.2;
      x.beginPath(); x.moveTo(cx0, cy0 + S); x.lineTo(cx0, cy0 - S * 0.9); x.stroke();
      x.lineWidth = 1.1;
      const veins = k === 0 ? [-1.25, -0.6, 0.6, 1.25] : [-1, -0.75, -0.5, 0.5, 0.75, 1];
      for (const v of veins) {
        const yy = k === 0 ? cy0 : cy0 + S * 0.5 * Math.abs(v);
        x.beginPath(); x.moveTo(cx0, yy);
        x.lineTo(cx0 + Math.sin(v * (k === 0 ? 1 : 1.2)) * S * 0.75, yy - Math.cos(v) * S * 0.75);
        x.stroke();
      }
      x.restore();
      // stem
      x.strokeStyle = dark; x.lineWidth = 3;
      x.beginPath(); x.moveTo(cx0, cy0 + S * 0.95); x.lineTo(cx0 + 4, cy0 + S * 1.2); x.stroke();
    }
  }
  const t = canvasTex(c, true, false);
  return t;
}

/* ---------- distant bare trees + fence silhouettes ---------- */
function makeTreeAtlas() {
  const [c, x] = makeCanvas(1024, 512);
  const R = mulberry32(5);
  x.strokeStyle = '#fff'; x.lineCap = 'round';
  function branch(px, py, len, ang, w, depth) {
    const ex = px + Math.sin(ang) * len, ey = py - Math.cos(ang) * len;
    x.lineWidth = w;
    x.beginPath(); x.moveTo(px, py);
    x.quadraticCurveTo(px + Math.sin(ang + (R() - 0.5) * 0.6) * len * 0.5, py - Math.cos(ang) * len * 0.5, ex, ey);
    x.stroke();
    if (depth <= 0 || w < 0.6) return;
    const n = 2 + (R() < 0.45 ? 1 : 0);
    for (let i = 0; i < n; i++) branch(ex, ey, len * (0.62 + R() * 0.2), ang + (R() - 0.5) * 1.3 + (i - (n - 1) / 2) * 0.35, w * 0.66, depth - 1);
  }
  for (let k = 0; k < 4; k++) {
    const bx = k * 256 + 128;
    branch(bx, 512, 120 + R() * 40, (R() - 0.5) * 0.15, 16 + R() * 6, 7);
  }
  return canvasTex(c, false, false);
}
function makeFenceTexture() {
  const [c, x] = makeCanvas(1024, 128);
  x.fillStyle = '#fff';
  for (let px = 4; px < 1024; px += 26) {
    const h = 96 + Math.sin(px * 0.05) * 6;
    x.beginPath(); x.moveTo(px, 128); x.lineTo(px, 128 - h + 10); x.lineTo(px + 7, 128 - h); x.lineTo(px + 14, 128 - h + 10); x.lineTo(px + 14, 128); x.fill();
  }
  x.fillRect(0, 50, 1024, 7); x.fillRect(0, 98, 1024, 7);
  const t = canvasTex(c, false, true);
  return t;
}

function makeSoftDot(size, stops) {
  const [c, x] = makeCanvas(size, size);
  const g = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  for (const [o, col] of stops) g.addColorStop(o, col);
  x.fillStyle = g; x.fillRect(0, 0, size, size);
  return canvasTex(c, false, false);
}

    vertexShader: /* glsl */`
      varying vec2 vUv; varying vec3 vW;
      void main() { vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }
    `,
    fragmentShader: /* glsl */`
      uniform float uTime, uOpacity, uSpeed; uniform vec3 uColor;
      varying vec2 vUv; varying vec3 vW;
      ${GLSL_NOISE}
      void main() {
        vec3 p = vec3(vW.x * 0.12 + uTime * uSpeed, vW.y * 0.45, vW.z * 0.05 + uTime * 0.01);
        float n = pkNoise(p) * 0.55 + pkNoise(p * 2.3 + 4.0) * 0.3 + pkNoise(p * 5.1 + 9.0) * 0.15;
        float band = smoothstep(0.0, 0.18, vUv.y) * (1.0 - smoothstep(0.3, 1.0, vUv.y));
        float edge = smoothstep(0.0, 0.12, vUv.x) * smoothstep(1.0, 0.88, vUv.x);
        float a = smoothstep(0.3, 0.8, n) * band * edge * uOpacity;
        gl_FragColor = vec4(uColor, a);

/* ------------------------------------------------------------------ *
 *  Pumpkin shape
 * ------------------------------------------------------------------ */
function makePumpkinParams(seed) {
  const R = mulberry32(seed);
  const Ns = [9, 10, 10, 11, 12, 10, 9];
  const N = Ns[Math.floor(R() * Ns.length)];
  const ribAmp = [];
  for (let i = 0; i < N; i++) ribAmp.push(R() * 2 - 1);
  return {
    seed, N, ribAmp,
    A: 1.1 + R() * 0.1, B: 0.76 + R() * 0.12, p: 2.25 + R() * 0.35,
    ribDepth: 0.06 + R() * 0.03, ribPow: 0.38 + R() * 0.16,
    topDip: 0.17 + R() * 0.06, topW: 0.09 + R() * 0.04,
    botDip: 0.1 + R() * 0.04, botW: 0.1,
    warpA: 0.03 + R() * 0.04, warpS: R() * TAU, warpB: 0.02 * R(), warpS2: R() * TAU,
    lump: 0.012 + R() * 0.01,
    kIn: 0.885,
    tone: R(), green: R(),
    stemLen: 0.32 + R() * 0.14, stemBend: 0.17 + R() * 0.14, stemDir: R() * TAU, stemTwist: (R() - 0.5) * 1.2,
  };
}

function ribCoord(P, ph) {
  const pw = ph + P.warpA * Math.sin(ph * 2 + P.warpS) + P.warpB * Math.sin(ph * 3 + P.warpS2);
  const rp = pw / TAU * P.N;
  return ((rp % P.N) + P.N) % P.N;
}

function shapeR(P, th, ph, inner) {
  const st = Math.sin(th), ct = Math.cos(th);
  const base = Math.pow(Math.pow(st / P.A, P.p) + Math.pow(Math.abs(ct) / P.B, P.p), -1 / P.p);
  const rp = ribCoord(P, ph);
  const idx = Math.floor(rp) % P.N;
  const s = Math.abs(Math.sin(Math.PI * rp));
  const shape = Math.pow(s, P.ribPow);
  const fade = Math.pow(st, 0.8);
  const depth = P.ribDepth * (inner ? 0.35 : 1);

/* ------------------------------------------------------------------ *
 *  Preset faces (drawn in the tangent plane of the pumpkin, then mapped into the mask)

const FRONT = { th0: 1.68, ph0: 0 };
const BACK = { th0: 1.2, ph0: Math.PI };

function faceMapper({ th0, ph0 }, scale) {

function startPreset(name) {

/* ------------------------------------------------------------------ *
 *  Candle state
 * ------------------------------------------------------------------ */
const candle = { on: false, level: 0, ember: 0, igniteT: -10 };
function toggleCandle() {
  if (candle.on) blowOut(); else ignite();
}
function ignite() {
  candle.on = true;
  candle.igniteT = clockTime;
}
function blowOut(quiet) {
  if (!candle.on) return;
  candle.on = false;
  if (!quiet) { candle.ember = 1; startSmoke(); }
}

let smokeT = -1;
const smokeExits = [];
function startSmoke() {
  smokeT = 0;
  smokeExits.length = 0;
  // smoke drifts out of the highest openings (or the lid seam around the stem)
  const ex = ambientStats.exits, cand = [];
  const p = new V3();
  for (let i = 0; i < ex.length; i += 2) {
    const th = ex[i], ph = ex[i + 1];
    dirOf(th, ph, p).multiplyScalar(shapeR(pumpkin.P, th, ph, false) + 0.02);
    cand.push({ y: p.y, p: p.clone(), front: Math.cos(ph) > 0 });
  }
  cand.sort((a, b) => b.y - a.y);
  const picked = [];
  for (const c of cand) {
    if (picked.length >= 3) break;
    if (picked.every((q) => q.p.distanceTo(c.p) > 0.18)) picked.push(c);
  }
  const front = cand.filter((c) => c.front);
  if (front.length) {
    const fp = front[0];
    if (picked.every((q) => q.p.distanceTo(fp.p) > 0.1)) picked.push(fp);
  }
  for (const c of picked) smokeExits.push(c.p);
  if (!smokeExits.length) {
    const top = shapeR(pumpkin.P, 0, 0, false);
    smokeExits.push(new V3(0.04, top + 0.04, 0.05));
  }
}
function emitSmoke(pos, push, s0, s1, life, alpha, phase, ymax) {
  const p = particles.find((q) => !q.alive);
  if (!p) return;
  p.alive = true; p.p.copy(pos); p.v.copy(push); p.age = 0; p.life = life; p.s0 = s0; p.s1 = s1; p.a = alpha;
  p.seed = Math.random(); p.phase = phase; p.ymax = ymax;
}
const _tmp = new V3(), _tmp2 = new V3();
const smokeAcc = [];
function updateSmoke(dt) {
  if (smokeT >= 0) {
    smokeT += dt;
    if (smokeT < 3.4) {
      const fade = 1 - smokeT / 3.4;
      // a thin column rising from the wick, stopped by the inside of the lid
      const wick = pumpkin.group.localToWorld(_tmp.set(0.004, pumpkin.candleBaseY + pumpkin.candleH + 0.03, 0));
      const lid = pumpkin.group.localToWorld(_tmp2.set(0, shapeR(pumpkin.P, 0, 0, true) - 0.06, 0)).y;
      smokeAcc[0] = (smokeAcc[0] || 0) + dt * 55 * (0.3 + 0.7 * fade);
      while (smokeAcc[0] >= 1) {
        smokeAcc[0] -= 1;
        emitSmoke(wick, _tmp2.set(0, 0, 0), 0.004, 0.03, 2.2, 0.22 * fade + 0.04, 0.0, lid);
      }
      // wisps curling out of the highest openings
      if (smokeT > 0.35) {
        smokeExits.forEach((e, i) => {
          smokeAcc[i + 1] = (smokeAcc[i + 1] || 0) + dt * 50 * fade;
          while (smokeAcc[i + 1] >= 1) {
            smokeAcc[i + 1] -= 1;
            const wp = pumpkin.group.localToWorld(_tmp.copy(e));
            const out = _tmp2.copy(e).setY(0).normalize().multiplyScalar(0.035);
            emitSmoke(wp, out, 0.006, 0.05 + Math.random() * 0.03, 2.6 + Math.random() * 1.0, 0.16 * fade + 0.03, 1.7 * (i + 1), 99);
          }
        });
      }
    } else { smokeT = -1; smokeAcc.length = 0; }
  }
  const t = clockTime;
  let k = 0;
  for (const p of particles) {
    if (!p.alive) continue;
    p.age += dt;
    if (p.age >= p.life || p.p.y > p.ymax) { p.alive = false; continue; }
    const u = p.age / p.life;
    // a shared, slowly moving velocity field keeps neighbouring puffs together, so they read as one curling ribbon
    const amp = 0.012 + 0.05 * u;
    const y = p.p.y, ph = p.phase;
    const vx = amp * (Math.sin(y * 19 - t * 1.6 + ph) + 0.6 * Math.sin(y * 7.3 + t * 0.8 + ph * 2.1));
    const vz = amp * (Math.cos(y * 16 - t * 1.25 + ph * 1.4) + 0.5 * Math.sin(y * 5.1 - t * 0.6 + ph));
    const vy = 0.085 * (1 - 0.45 * u);
    p.v.multiplyScalar(Math.exp(-dt * 2.5));
    p.p.x += (vx + p.v.x) * dt; p.p.y += (vy + p.v.y) * dt; p.p.z += (vz + p.v.z) * dt;
    smokePos[k * 3] = p.p.x; smokePos[k * 3 + 1] = p.p.y; smokePos[k * 3 + 2] = p.p.z;
    smokeSize[k] = lerp(p.s0, p.s1, Math.pow(u, 0.8));
    const lidFade = p.ymax < 50 ? smooth(p.ymax, p.ymax - 0.03, p.p.y) : 1;
    smokeAlpha[k] = p.a * smooth(0, 0.08, u) * (1 - smooth(0.4, 1, u)) * lidFade;
    smokeSeed[k] = p.seed;
    k++;
  }
  for (let i = k; i < SMOKE_MAX; i++) smokeAlpha[i] = 0;
  smokeGeo.setDrawRange(0, k);
  smokeGeo.attributes.position.needsUpdate = true;
  smokeGeo.attributes.aSize.needsUpdate = true;
  smokeGeo.attributes.aAlpha.needsUpdate = true;
  smokeGeo.attributes.aSeed.needsUpdate = true;
}

/* ------------------------------------------------------------------ *
 *  Input: carve with left button, click pumpkin to toggle candle
 * ------------------------------------------------------------------ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const brushInput = document.getElementById('brush');
let brushR = parseFloat(brushInput.value);
brushInput.addEventListener('input', () => { brushR = parseFloat(brushInput.value); });

const ring = new THREE.Mesh(new THREE.RingGeometry(0.86, 1, 48), new THREE.MeshBasicMaterial({
  color: new THREE.Color().setRGB(1.0, 0.75, 0.5), transparent: true, opacity: 0.55, depthTest: false, depthWrite: false, fog: false,
}));
ring.renderOrder = 20;
ring.visible = false;
scene.add(ring);

function hitPumpkin(clientX, clientY) {
  if (!pumpkin.proxy) return null;
  ndc.set(clientX / innerWidth * 2 - 1, -(clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(pumpkin.proxy, false);
  return hits.length ? hits[0] : null;
}

let pointer = null;   // active left-button gesture
let lastLocal = null;
const _loc = new V3(), _seg = new V3();

function carveLocal(local) {
  const r = local.length();
  const th = Math.acos(clamp(local.y / r, -1, 1));
  if (th < 0.36 || th > Math.PI - 0.3) return;
  const ph = Math.atan2(local.x, local.z);
  const x = (ph + Math.PI) / TAU * MW, y = th / Math.PI * MH;
  const jitter = 0.94 + 0.12 * noise1(performance.now() * 0.01, 3);
  const ang = brushR * jitter / r;
  const ry = ang / Math.PI * MH;
  const rx = ang / (TAU * Math.max(Math.sin(th), 0.2)) * MW;
  paintEllipse(x, y, rx, ry, '#000');
}
function carveTo(local) {
  if (lastLocal) {
    const dist = lastLocal.distanceTo(local);
    const steps = Math.min(200, Math.ceil(dist / (brushR * 0.3)));
    for (let s = 1; s <= steps; s++) carveLocal(_seg.lerpVectors(lastLocal, local, s / steps));
  } else carveLocal(local);
  lastLocal = local.clone();
}

const canvasEl = renderer.domElement;
canvasEl.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  if (e.pointerType === 'touch' && pointer) { pointer = null; return; }
  const hit = hitPumpkin(e.clientX, e.clientY);
  pointer = { id: e.pointerId, x: e.clientX, y: e.clientY, hit, carving: false };
  lastLocal = null;
});
canvasEl.addEventListener('pointermove', (e) => {
  const hit = hitPumpkin(e.clientX, e.clientY);
  updateRing(hit, e);
  if (!pointer || pointer.id !== e.pointerId) return;
  if (!pointer.carving) {
    if (Math.hypot(e.clientX - pointer.x, e.clientY - pointer.y) < 5) return;
    pointer.carving = true;
    if (pointer.hit) carveTo(pumpkin.group.worldToLocal(_loc.copy(pointer.hit.point)));
  }
  if (hit) carveTo(pumpkin.group.worldToLocal(_loc.copy(hit.point)));
  else lastLocal = null;
});
function endPointer(e) {
  if (!pointer || pointer.id !== e.pointerId) return;
  if (!pointer.carving && pointer.hit && e.type === 'pointerup') toggleCandle();
  if (pointer.carving) { cutDirty = true; lastCutBuild = 0; }
  pointer = null; lastLocal = null;
}
canvasEl.addEventListener('pointerup', endPointer);
canvasEl.addEventListener('pointercancel', endPointer);
canvasEl.addEventListener('pointerleave', () => { ring.visible = false; });

function updateRing(hit, e) {
  const rightDrag = e.buttons & 2;
  if (!hit || rightDrag) { ring.visible = false; canvasEl.style.cursor = rightDrag ? 'grabbing' : 'default'; return; }
  const local = pumpkin.group.worldToLocal(_loc.copy(hit.point));
  const th = Math.acos(clamp(local.y / local.length(), -1, 1));
  const ok = th >= 0.36 && th <= Math.PI - 0.3;
  canvasEl.style.cursor = ok ? 'crosshair' : 'pointer';
  ring.visible = ok && e.pointerType !== 'touch' && !document.body.classList.contains('hide-ui');
  if (!ring.visible) return;
  const n = hit.face.normal.clone().transformDirection(pumpkin.proxy.matrixWorld);
  ring.position.copy(hit.point).addScaledVector(n, 0.002);
  ring.lookAt(_tmp.copy(hit.point).add(n));
  ring.scale.setScalar(brushR * PS);
}

document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => startPreset(b.dataset.preset)));
document.getElementById('reset').addEventListener('click', () => {
  blowOut(true);
  candle.level = 0;
  presetAnim = null;
  for (const p of particles) p.alive = false;
  smokeT = -1;
  createPumpkin((Math.random() * 1e9) | 0);
  pumpkin.drop = 0;
});
if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
  document.getElementById('hint').innerHTML = '<b>单指拖动</b> 雕刻<i>/</i><b>轻点南瓜</b> 点亮 · 吹灭蜡烛<i>/</i><b>双指</b> 旋转 · 缩放';
}
window.addEventListener('keydown', (e) => {
  if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('hide-ui');
});

/* ------------------------------------------------------------------ *
 *  Post-processing
 * ------------------------------------------------------------------ */
const rt = new THREE.WebGLRenderTarget(innerWidth * pixelRatio, innerHeight * pixelRatio, {
  type: THREE.HalfFloatType,
  samples: renderer.capabilities.isWebGL2 ? 4 : 0,
});
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.55, 0.6, 0.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
const finalPass = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, uTime: { value: 0 }, uRes: { value: new THREE.Vector2(innerWidth, innerHeight) } },
  vertexShader: /* glsl */`varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
    float h(vec2 p) { return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main() {
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      vec2 q = vUv - 0.5;
      q.x *= uRes.x / uRes.y;
      float v = smoothstep(1.25, 0.25, length(q));
      c *= mix(0.55, 1.0, v);
      c += (h(vUv * uRes + fract(uTime) * 100.0) - 0.5) * 0.022;
      gl_FragColor = vec4(c, 1.0);
    }
  `,
});
composer.addPass(finalPass);
composer.setPixelRatio(pixelRatio);
composer.setSize(innerWidth, innerHeight);

function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(pixelRatio);
  composer.setSize(innerWidth, innerHeight);
  finalPass.uniforms.uRes.value.set(innerWidth, innerHeight);
  smokeUniforms.uScale.value = innerHeight * pixelRatio * 0.5 / Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
}
window.addEventListener('resize', onResize);
onResize();

/* ------------------------------------------------------------------ *
 *  Loop
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
let clockTime = 0;
let perfAcc = 0, perfFrames = 0, perfChecks = 0;
const camWorld = new V3(), flameWorld = new V3();

function flicker(t) {
  let f = 0.84 + 0.06 * Math.sin(t * 9.3) + 0.04 * Math.sin(t * 15.1 + 1.3) + 0.14 * (noise1(t * 7.5, 11) - 0.5) + 0.08 * (noise1(t * 21, 5) - 0.5);
  f -= 0.18 * Math.max(0, noise1(t * 0.6, 19) - 0.68) * 3.0;  // occasional draught
  return f;
}

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  clockTime += dt;
  const t = clockTime;

  controls.update();
  updatePreset(dt);

  if (maskDirty) { maskTex.needsUpdate = true; maskDirty = false; }
  const now = performance.now();
  if (cutDirty && (now - lastCutBuild > (pointer || presetAnim ? 70 : 0))) rebuildCut();

  // drop-in animation for a fresh pumpkin
  if (pumpkin.drop < 1) {
    pumpkin.drop = Math.min(1, pumpkin.drop + dt * 1.6);
    const u = pumpkin.drop;
    const bounce = Math.abs(Math.cos(u * Math.PI * 1.5)) * Math.pow(1 - u, 2);
    pumpkin.group.position.y = (pumpkin.lift + bounce * 0.55) * PS;
    const sq = 1 + (u < 0.98 ? (1 - bounce) * 0.04 * Math.sin(u * 40) * (1 - u) : 0);
    pumpkin.group.scale.set(sq * PS, (2 - sq) * PS, sq * PS);
    moon.shadow.needsUpdate = true; doorLight.shadow.needsUpdate = true;
  }

  // candle
  const target = candle.on ? 1 : 0;
  const rate = candle.on ? 3.2 : 9;
  candle.level += (target - candle.level) * Math.min(1, dt * rate);
  if (!candle.on && candle.level < 0.003) candle.level = 0;
  const igniteFlare = candle.on ? Math.max(0, 1 - (t - candle.igniteT) / 0.5) : 0;
  const fl = flicker(t);
  const L = candle.level;
  const sway = (noise1(t * 1.7, 23) - 0.5) * 0.35 + (noise1(t * 6, 29) - 0.5) * 0.12;

  candleLight.intensity = 1.9 * L * fl * (1 + igniteFlare * 0.5);
  candleLight.shadow.autoUpdate = L > 0.001;
  pumpkin.flame.getWorldPosition(flameWorld);
  candleLight.position.set(
    flameWorld.x + (sway * 0.05 + (noise1(t * 3.1, 31) - 0.5) * 0.012) * PS,
    flameWorld.y + (0.06 + (fl - 0.85) * 0.03) * PS,
    flameWorld.z + (noise1(t * 2.9, 37) - 0.5) * 0.016 * PS,
  );
  flameUniforms.uTime.value = t;
  flameUniforms.uLevel.value = L * (0.85 + 0.25 * fl);
  flameUniforms.uSway.value = sway;
  pumpkin.flame.scale.set(0.9 + 0.2 * fl, L * (0.75 + 0.45 * fl + igniteFlare * 0.4), 1);
  pumpkin.flame.visible = L > 0.001;
  camera.getWorldPosition(camWorld);
  pumpkin.flame.rotation.y = Math.atan2(camWorld.x - flameWorld.x, camWorld.z - flameWorld.z);
  pumpkin.halo.material.color.setRGB(1.0, 0.45, 0.12).multiplyScalar(L * fl * 0.9);
  pumpkin.halo.visible = L > 0.001;

  U.skinGlow.value = L * fl;
  U.cutGlow.value = L * fl * 0.85;
  U.pulpGlow.value = L * fl;
  U.waxGlow.value = L * fl;
  candle.ember = Math.max(0, candle.ember - dt * 0.45);
  wickMat.emissiveIntensity = (L * 1.5 + candle.ember * candle.ember * 3.0) * (0.8 + 0.3 * Math.random());

  // light that escapes and bounces off floor and wall
  const fo = Math.min(1, ambientStats.front / 0.035), bo = Math.min(1, ambientStats.back / 0.035);
  bounceFront.intensity = 0.09 * L * fl * fo;
  bounceFront.position.set(ambientStats.frontDir.x * 0.5, 0.05, ambientStats.frontDir.z * 0.5);
  bounceBack.intensity = 0.14 * L * fl * bo;
  bounceBack.position.set(0, 0.55, WALL_Z + 0.25);

  updateSmoke(dt);

  skyUniforms.uTime.value = t;
  for (const s of fogSheets) s.material.uniforms.uTime.value = t;
  finalPass.uniforms.uTime.value = t;

  composer.render(dt);

  // adaptive resolution for slower laptops
  perfAcc += dt; perfFrames++;
  if (perfAcc > 2.0) {
    const avg = perfAcc / perfFrames;
    if (avg > 1 / 40 && perfChecks < 8) {
      if (pixelRatio > 1.0) {
        pixelRatio = Math.max(1.0, pixelRatio - 0.25);
        renderer.setPixelRatio(pixelRatio);
        onResize();
      } else if (candleLight.shadow.mapSize.x > 512) {
        candleLight.shadow.mapSize.set(512, 512);
        if (candleLight.shadow.map) { candleLight.shadow.map.dispose(); candleLight.shadow.map = null; }
      } else if (pixelRatio > 0.8) {
        pixelRatio = 0.75;
        renderer.setPixelRatio(pixelRatio);
        onResize();
      }
    }
    perfChecks++;
    perfAcc = 0; perfFrames = 0;
  }
  requestAnimationFrame(tick);
}

/* ------------------------------------------------------------------ */
createPumpkin(20251031);
requestAnimationFrame(() => {
  tick();
  setTimeout(() => document.getElementById('loading').classList.add('done'), 300);
});
</script>
</body>
</html>
