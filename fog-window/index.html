<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0d14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>起雾的窗</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b0d14;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
  }
  .title {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top));
    left: calc(20px + env(safe-area-inset-left));
    color: rgba(235, 238, 245, 0.55);
    font-size: 12px;
    letter-spacing: 0.4em;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.35);
    pointer-events: none;
  }
  .hint {
    position: fixed;
    left: 0;
    right: 0;
    top: 46%;
    text-align: center;
    color: rgba(255, 255, 255, 0.92);
    font-size: 16px;
    letter-spacing: 0.3em;
    text-shadow: 0 1px 10px rgba(0, 0, 0, 0.45);
    pointer-events: none;
    transition: opacity 1.2s ease;
  }
  .hint span { display: inline-block; animation: breathe 3s ease-in-out infinite; }
  .hint.hide { opacity: 0; }
  @keyframes breathe { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="title">雨夜 · 起雾的窗</div>
<div class="hint" id="hint"><span>用手指擦一擦玻璃</span></div>
<noscript><p style="color:#ccd;text-align:center;margin-top:40vh">需要开启 JavaScript</p></noscript>

<script>
(() => {
  'use strict';

  let canvas = document.getElementById('c');
  const hint = document.getElementById('hint');

  let viewW = 0, viewH = 0;     // CSS 像素
  let sizeK = 1;                // 以 390px 宽手机为基准的尺寸系数

  const rand = (a, b) => a + Math.random() * (b - a);

  // ---------------------------------------------------------------------------
  // 雾气遮罩：低分辨率网格，值 = 清晰程度。>1 的部分是“缓冲”，
  // 让擦过的地方先保持清晰一会儿，再随时间慢慢重新起雾。
  // ---------------------------------------------------------------------------
  const MASK_CELLS = 30000;
  const REGROW = 0.09;          // 每秒回落量
  const WIPE_VALUE = 1.6;       // 擦拭后的值：约 7 秒后开始起雾，约 18 秒完全蒙上
  const STREAK_VALUE = 1.3;     // 水痕流过留下的清晰线条

  let mcols = 0, mrows = 0, mcx = 4, mcy = 4;
  let mask, mask8;

  function initMask() {
    const cell = Math.max(2.5, Math.sqrt((viewW * viewH) / MASK_CELLS));
    mcols = Math.max(16, Math.round(viewW / cell));
    mrows = Math.max(16, Math.round(viewH / cell));
    mcx = viewW / mcols;
    mcy = viewH / mrows;
    mask = new Float32Array(mcols * mrows);
    mask8 = new Uint8Array(mcols * mrows);
  }

  // 在 (x, y) 处把遮罩抬到 value，边缘柔和
  function stampMask(x, y, r, value) {
    const rr = Math.max(r, mcx * 0.9);
    const i0 = Math.max(0, Math.floor((x - rr) / mcx)), i1 = Math.min(mcols - 1, Math.floor((x + rr) / mcx));
    const j0 = Math.max(0, Math.floor((y - rr) / mcy)), j1 = Math.min(mrows - 1, Math.floor((y + rr) / mcy));
    for (let j = j0; j <= j1; j++) {
      const dy = ((j + 0.5) * mcy - y) / rr;
      for (let i = i0; i <= i1; i++) {
        const dx = ((i + 0.5) * mcx - x) / rr;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d >= 1) continue;
        const f = d < 0.55 ? 1 : 1 - (d - 0.55) / 0.45;
        const v = value * f * f * (3 - 2 * f);
        const k = j * mcols + i;
        if (v > mask[k]) mask[k] = v;
      }
    }
  }

  function maskAt(x, y) {
    const i = Math.min(mcols - 1, Math.max(0, Math.floor(x / mcx)));
    const j = Math.min(mrows - 1, Math.max(0, Math.floor(y / mcy)));
    return mask[j * mcols + i];
  }

  function decayMask(dt) {
    const d = REGROW * dt;
    for (let k = 0; k < mask.length; k++) {
      const v = mask[k] - d;
      mask[k] = v > 0 ? v : 0;
    }
  }

  function encodeMask() {
    for (let k = 0; k < mask.length; k++) {
      const v = mask[k];
      mask8[k] = v >= 1 ? 255 : (v * 255) | 0;
    }
  }

  // ---------------------------------------------------------------------------
  // 玻璃外侧的雨珠：大多静止，较大的会走走停停地往下滑，
  // 沿途吞并小水珠、留下细小的拖尾水滴
  // ---------------------------------------------------------------------------
  let drops = [];
  let dropCap = 400;
  let spawnAcc = 0;

  function newDrop(x, y, r) {
    return { x, y, r, vy: 0, moving: false, pause: 0, travel: 0, seed: Math.random() * 100, dead: false };
  }

  function rainRadius() {
    const u = Math.random();
    const r = u < 0.68 ? rand(0.8, 1.8) : u < 0.94 ? rand(2, 4.5) : rand(5, 8);
    return r * sizeK;
  }

  function initDrops() {
    const area = viewW * viewH;
    dropCap = Math.round(area / 750);
    drops = [];
    const n = Math.round(area / 1150);
    for (let i = 0; i < n; i++) drops.push(newDrop(rand(0, viewW), rand(0, viewH), rainRadius()));
  }

  function updateDrops(dt) {
    const slideR = 4.2 * sizeK, stopR = 2.6 * sizeK, maxR = 11 * sizeK;

    // 新雨点打在玻璃上
    spawnAcc += dt * (viewW * viewH) / 26000;
    while (spawnAcc >= 1) {
      spawnAcc -= 1;
      if (drops.length < dropCap) drops.push(newDrop(rand(0, viewW), rand(-10, viewH), rainRadius()));
    }

    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      if (d.dead) continue;

      if (!d.moving) {
        if (d.r > slideR && Math.random() < dt * 0.22 * (d.r / slideR)) {
          d.moving = true;
          d.vy = 0;
        }
        continue;
      }

      // 走走停停地滑落
      if (d.pause > 0) {
        d.pause -= dt;
        d.vy *= 0.9;
      } else {
        const target = 9 * sizeK + d.r * 5;
        d.vy += (target - d.vy) * Math.min(1, dt * 2.5);
        if (Math.random() < dt * 0.3) d.pause = rand(0.2, 1.4);
      }
      const dy = d.vy * dt;
      d.y += dy;
      d.x += Math.sin(d.y * 0.045 + d.seed) * dy * 0.1;
      d.travel += dy;

      // 拖尾：留下小水珠，自身失去一点水
      if (d.travel > d.r * 1.5) {
        d.travel = 0;
        if (Math.random() < 0.65) {
          const tr = d.r * rand(0.2, 0.36);
          drops.push(newDrop(d.x + rand(-0.3, 0.3) * d.r, d.y - d.r * 1.2, tr));
          d.r = Math.sqrt(Math.max(0, d.r * d.r - tr * tr * 0.6));
        }
      }
      if (d.r < stopR) d.moving = false;
      if (d.y - d.r > viewH) { d.dead = true; continue; }

      // 吞并路径上的其他水珠
      for (let j = 0; j < drops.length; j++) {
        if (j === i) continue;
        const o = drops[j];
        if (o.dead) continue;
        const ox = o.x - d.x, oy = o.y - d.y;
        const lim = (d.r + o.r) * 0.72;
        if (ox * ox + oy * oy < lim * lim) {
          d.r = Math.min(maxR, Math.sqrt(d.r * d.r + o.r * o.r));
          if (o.y > d.y) d.y = (d.y + o.y) * 0.5;
          o.dead = true;
        }
      }
    }

    if (drops.some((d) => d.dead)) drops = drops.filter((d) => !d.dead);
  }

  // 水珠法线贴图精灵：R/G = 法线，B = 厚度
  function makeDropSprite() {
    const S = 64;
    const c = document.createElement('canvas');
    c.width = c.height = S;
    const g = c.getContext('2d');
    const img = g.createImageData(S, S);
    const px = img.data;
    for (let y = 0; y < S; y++) {
      for (let x = 0; x < S; x++) {
        const nx = ((x + 0.5) / S) * 2 - 1;
        let ny = ((y + 0.5) / S) * 2 - 1;
        ny = ny < 0 ? ny * 1.12 : ny * 0.96;   // 上窄下圆，像挂在玻璃上的水珠
        const r = Math.sqrt(nx * nx + ny * ny);
        const k = (y * S + x) * 4;
        if (r >= 1) { px[k + 3] = 0; continue; }
        const z = Math.sqrt(1 - r * r);
        px[k] = 128 + nx * 127;
        px[k + 1] = 128 + Math.max(-1, Math.min(1, ny)) * 127;
        px[k + 2] = z * 255;
        px[k + 3] = Math.min(1, (1 - r) * S * 0.22) * 255;
      }
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  const sprite = makeDropSprite();
  const dropCanvas = document.createElement('canvas');
  const dctx = dropCanvas.getContext('2d', { alpha: false });
  let dScale = 1;

  function sizeDropCanvas() {
    dScale = Math.min(1, Math.sqrt(380000 / Math.max(1, viewW * viewH)));
    dropCanvas.width = Math.max(1, Math.round(viewW * dScale));
    dropCanvas.height = Math.max(1, Math.round(viewH * dScale));
  }

  function drawDrops() {
    dctx.setTransform(1, 0, 0, 1, 0, 0);
    dctx.fillStyle = 'rgb(128,128,0)';
    dctx.fillRect(0, 0, dropCanvas.width, dropCanvas.height);
    dctx.setTransform(dScale, 0, 0, dScale, 0, 0);
    for (let i = 0; i < drops.length; i++) {
      const d = drops[i];
      const w = d.r * 2 * (d.moving ? 0.92 : 1);
      const h = d.r * 2 * (d.moving ? 1.22 : 1.05);
      dctx.drawImage(sprite, d.x - w * 0.5, d.y - h * 0.58, w, h);
    }
  }

  // ---------------------------------------------------------------------------
  // 玻璃内侧的凝结水痕：在雾里慢慢流下，划出一道清晰的细线
  // ---------------------------------------------------------------------------
  const MAX_DRIPS = 4;
  let drips = [];
  let nextDrip = 0;
  const dripData = new Float32Array(MAX_DRIPS * 4);

  function spawnDrip(x, y) {
    if (drips.length >= MAX_DRIPS || y > viewH * 0.9) return;
    drips.push({
      x, y,
      r: rand(2.4, 3.8) * sizeK,
      v: 0, pause: 0,
      left: rand(90, 460) * sizeK,
      alpha: 0, fading: false,
      seed: Math.random() * 100,
    });
  }

  function updateDrips(dt, now) {
    if (now > nextDrip) {
      nextDrip = now + rand(4500, 10000);
      for (let tries = 0; tries < 6; tries++) {
        const x = rand(viewW * 0.08, viewW * 0.92), y = rand(viewH * 0.05, viewH * 0.6);
        if (maskAt(x, y) < 0.15) { spawnDrip(x, y); break; }
      }
    }

    for (const d of drips) {
      if (d.fading) {
        d.alpha -= dt * 0.3;
        continue;
      }
      d.alpha = Math.min(1, d.alpha + dt * 2);
      if (d.pause > 0) {
        d.pause -= dt;
        d.v *= 0.85;
      } else {
        d.v += (16 * sizeK + d.r * 3 - d.v) * Math.min(1, dt * 2);
        if (Math.random() < dt * 0.45) d.pause = rand(0.3, 1.6);
      }
      const dy = d.v * dt;
      d.y += dy;
      d.x += Math.sin(d.y * 0.04 + d.seed) * dy * 0.05;
      d.left -= dy;
      d.r = Math.max(1.6 * sizeK, d.r - dy * 0.0025);
      stampMask(d.x, d.y - d.r * 0.4, d.r * 1.1, STREAK_VALUE);
      if (d.left <= 0 || d.y - d.r > viewH) d.fading = true;
    }
    drips = drips.filter((d) => d.alpha > 0 || !d.fading);

    dripData.fill(0);
    drips.forEach((d, i) => {
      dripData[i * 4] = d.x / viewW;
      dripData[i * 4 + 1] = d.y / viewH;
      dripData[i * 4 + 2] = d.r / viewH;
      dripData[i * 4 + 3] = Math.max(0, d.alpha);
    });
  }

  // ---------------------------------------------------------------------------
  // WebGL 渲染
  // ---------------------------------------------------------------------------
  const VERT = `
    attribute vec2 aPos;
    varying vec2 vUv;
    void main() {
      vUv = vec2(aPos.x * 0.5 + 0.5, 0.5 - aPos.y * 0.5);
      gl_Position = vec4(aPos, 0.0, 1.0);
    }`;

  const FRAG = `
    #ifdef GL_FRAGMENT_PRECISION_HIGH
    precision highp float;
    #else
    precision mediump float;
    #endif

    varying vec2 vUv;
    uniform sampler2D uMask;
    uniform sampler2D uDrops;
    uniform vec2 uMaskTexel;
    uniform vec2 uView;          // CSS 像素尺寸
    uniform float uTime;
    uniform vec4 uDrip[4];       // 内侧水痕：xy(uv) r(相对高度) alpha

    const float BLUR_CLEAR = 0.008;
    const float BLUR_FOG = 0.036;

    float hash1(float n) { return fract(sin(n * 0.0137 + 1.7) * 43758.5453); }
    float hash2(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash2(i), b = hash2(i + vec2(1.0, 0.0));
      float c = hash2(i + vec2(0.0, 1.0)), d = hash2(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    float box1(float f, float a, float b, float w) {
      return smoothstep(a - w, a + w, f) - smoothstep(b - w, b + w, f);
    }

    // 一排楼：轮廓 + 亮着的窗户。blur 越大，窗户越接近平均亮度（解析式预滤波）
    vec3 skyline(vec3 col, vec2 p, float blur, float freq, float roofBase, float hMin, float hMax,
                 float seed, vec3 wall, float rows, float bright) {
      float x = p.x * freq + seed * 17.0;
      float id = floor(x);
      float fx = fract(x);
      float hh = hash1(id * 3.1 + seed);
      float top = roofBase - mix(hMin, hMax, hh * hh * 0.6 + hh * 0.4);
      float gap = 0.03 + 0.12 * hash1(id * 1.73 + seed * 5.0);
      float inX = box1(fx, gap, 1.0 - gap, blur * freq + 0.003);
      float inY = smoothstep(top - blur, top + blur, p.y) * (1.0 - smoothstep(0.765 - blur, 0.765 + blur, p.y));
      float cov = clamp(inX * inY, 0.0, 1.0);

      float ncol = 3.0 + floor(hash1(id * 2.1 + seed) * 4.0);
      float span = 1.0 - 2.0 * gap;
      float u = (fx - gap) / span * ncol;
      float v = (p.y - top) * rows;
      vec2 wid = vec2(floor(u), floor(v));
      vec2 wf = vec2(fract(u), fract(v));
      float lit = step(0.6, hash2(wid + id * 7.31 + seed));
      float warm = step(0.3, hash2(wid * 1.37 + id + seed * 3.0));
      vec3 wc = mix(vec3(0.55, 0.72, 1.0), vec3(1.0, 0.66, 0.32), warm) * (0.5 + 0.7 * hash2(wid + 3.3 + id));
      float wu = blur * freq * ncol / span;
      float wv = blur * rows;
      float shape = box1(wf.x, 0.22, 0.78, wu + 0.03) * box1(wf.y, 0.28, 0.72, wv + 0.03);
      float k = smoothstep(0.12, 0.5, max(wu, wv));
      vec3 win = mix(wc * lit * shape, vec3(0.85, 0.66, 0.45) * 0.085, k);
      float inner = smoothstep(top + 0.008, top + 0.02 + blur, p.y);

      // 高楼楼顶的航空障碍灯
      float beacon = 0.0;
      if (hh > 0.8) {
        vec2 bp = vec2((id + 0.5) / freq - seed * 17.0 / freq, top - 0.006);
        float br = 0.003 + blur * 0.6;
        beacon = (1.0 - smoothstep(br * 0.4, br, length(p - bp))) * step(0.45, fract(uTime * 0.45 + hh * 7.0))
               * (0.003 * 0.003) / (br * br) * 9.0;
      }

      vec3 b = wall + win * bright * inner;
      return mix(col, b, cov) + vec3(1.0, 0.15, 0.1) * beacon;
    }

    vec3 lightColor(float L, float h) {
      if (L < 0.5) return mix(vec3(1.0, 0.52, 0.16), vec3(1.0, 0.78, 0.5), step(0.7, h));
      if (L < 1.5) return h < 0.55 ? vec3(1.0, 0.1, 0.07) : (h < 0.85 ? vec3(1.0, 0.88, 0.72) : vec3(1.0, 0.58, 0.12));
      return h < 0.3 ? vec3(1.0, 0.22, 0.58) : (h < 0.55 ? vec3(0.2, 0.82, 1.0) : (h < 0.7 ? vec3(0.3, 1.0, 0.45) : vec3(1.0, 0.68, 0.38)));
    }

    // 焦外光斑：街灯、车灯、远处霓虹，以及湿漉漉路面上的倒影
    vec3 lights(vec2 p, float blur) {
      vec3 acc = vec3(0.0);
      for (int L = 0; L < 3; L++) {
        float fl = float(L);
        float scale = L == 0 ? 4.0 : (L == 1 ? 9.0 : 15.0);
        float speed = L == 1 ? 0.03 : 0.0;
        float yC = L == 0 ? 0.62 : (L == 1 ? 0.83 : 0.6);
        float yJ = L == 0 ? 0.03 : (L == 1 ? 0.04 : 0.14);
        float rMin = L == 0 ? 0.028 : (L == 1 ? 0.013 : 0.007);
        float rMax = L == 0 ? 0.046 : (L == 1 ? 0.024 : 0.015);

        vec2 q = p;
        q.x += uTime * speed + fl * 3.7;
        float x = q.x * scale;
        float cx = floor(x);
        float side = fract(x) < 0.5 ? -1.0 : 1.0;

        for (int n = 0; n < 2; n++) {
          float id = cx + (n == 0 ? 0.0 : side);
          float h = hash1(id * 1.31 + fl * 17.0);
          if (h < 0.22) continue;
          vec2 c = vec2((id + 0.2 + 0.6 * hash1(id * 2.7 + fl)) / scale,
                        yC + (hash1(id * 3.9 + fl) - 0.5) * 2.0 * yJ);
          float r0 = mix(rMin, rMax, hash1(id * 5.3 + fl));
          float r = r0 + blur * 0.7;
          float soft = 0.18 * r0 + blur * 0.6 + 0.002;
          float energy = (r0 * r0) / (r * r);
          vec3 lc = lightColor(fl, hash1(id * 7.1 + fl)) * (0.6 + 0.7 * h) * energy;
          float d = length(q - c);
          acc += lc * (1.0 - smoothstep(r - soft, r, d)) * (L == 2 ? 0.8 : 1.1);
          if (L < 2) {
            vec2 rq = (q - vec2(c.x, 0.9 + (c.y - 0.62) * 0.5)) * vec2(1.0, 0.16);
            float rr = r * 0.55;
            acc += lc * (1.0 - smoothstep(rr - soft * 0.5, rr + soft, length(rq))) * 0.3
                 * smoothstep(0.765, 0.8, p.y);
          }
        }
      }
      return acc;
    }

    float rainStreaks(vec2 p) {
      vec2 q = p;
      q.x += q.y * 0.14;
      q *= vec2(70.0, 3.0);
      float id = floor(q.x);
      float h = hash1(id * 1.7);
      float y = q.y - uTime * (4.0 + 3.0 * h) + h * 30.0;
      float seg = fract(y * 0.5);
      float line = (1.0 - smoothstep(0.0, 0.14, abs(fract(q.x) - 0.5)))
                 * smoothstep(0.0, 0.08, seg) * (1.0 - smoothstep(0.1, 0.32, seg));
      return line * step(0.5, h);
    }

    vec3 scene(vec2 uv, float blur) {
      float aspect = uView.x / uView.y;
      vec2 p = vec2((uv.x - 0.5) * aspect, uv.y);

      // 被城市灯光映亮的低云
      vec3 col = mix(vec3(0.03, 0.036, 0.07), vec3(0.2, 0.11, 0.12), smoothstep(0.0, 0.62, p.y));
      col += vec3(0.06, 0.04, 0.045) * vnoise(vec2(p.x * 3.0 + uTime * 0.015, p.y * 7.0))
             * (1.0 - smoothstep(0.25, 0.6, p.y));

      // 湿漉漉的街面
      float street = smoothstep(0.765 - blur, 0.765 + blur, p.y);
      vec3 road = vec3(0.022, 0.024, 0.034) + vec3(0.07, 0.045, 0.04) * (1.0 - smoothstep(0.77, 1.0, p.y));
      col = mix(col, road, street);

      col = skyline(col, p, blur, 14.0, 0.7, 0.1, 0.42, 1.0, vec3(0.04, 0.042, 0.068), 72.0, 0.55);
      col = mix(col, vec3(0.13, 0.09, 0.11), 0.22 * smoothstep(0.25, 0.75, p.y) * (1.0 - street));
      col = skyline(col, p, blur, 7.0, 0.77, 0.16, 0.52, 4.0, vec3(0.016, 0.018, 0.03), 46.0, 1.0);

      col += lights(p, blur);
      col += vec3(0.45, 0.5, 0.6) * rainStreaks(p) * 0.1 * (1.0 - smoothstep(0.003, 0.015, blur));
      return col;
    }

    void main() {
      vec2 uv = vUv;
      vec2 css = uv * uView;
      float aspect = uView.x / uView.y;

      // 雾气的清晰度（带噪声，让雾重新长回来时斑驳不均）
      float m = texture2D(uMask, uv).r;
      float fogPatch = vnoise(css / 26.0) * 0.65 + vnoise(css / 7.0) * 0.35;
      float clearAmt = smoothstep(0.2, 0.7, m * (0.75 + fogPatch * 0.5));

      vec3 fogV = vec3(0.0);
      vec3 clearV = vec3(0.0);

      if (clearAmt < 0.995) {
        vec3 b = scene(uv, BLUR_FOG);
        float lum = dot(b, vec3(0.3, 0.55, 0.15));
        fogV = b * 0.45 + vec3(0.26, 0.29, 0.345) * (0.85 + lum * 1.6);
        fogV *= 0.9 + 0.2 * fogPatch;
        fogV *= 0.93 + 0.14 * vnoise(css * 0.7);      // 细密的凝结水汽颗粒
      }

      if (clearAmt > 0.005) {
        // 玻璃外侧的雨珠：像小透镜一样折射出倒置的街景
        vec3 dt = texture2D(uDrops, uv).rgb;
        vec2 dn = (dt.rg * 255.0 - 128.0) / 127.0;
        float dz = dt.b;
        float dm = smoothstep(0.0, 0.14, dz);
        vec2 suv = uv - dn * (46.0 / uView) * dm;
        clearV = scene(suv, BLUR_CLEAR) + 0.012;

        vec3 n3 = normalize(vec3(dn, dz + 0.05));
        float spec = pow(max(dot(n3, normalize(vec3(-0.35, -0.65, 0.68))), 0.0), 28.0);
        vec3 dropC = clearV * 1.3 * mix(0.6, 1.0, smoothstep(0.0, 0.5, dz)) + vec3(0.9, 0.92, 1.0) * spec * 0.7;
        clearV = mix(clearV, dropC, dm);
      }

      vec3 col = mix(fogV, clearV, clearAmt);

      // 擦痕边缘积起的一圈水汽
      float mx = texture2D(uMask, uv + vec2(uMaskTexel.x, 0.0)).r;
      float my = texture2D(uMask, uv + vec2(0.0, uMaskTexel.y)).r;
      float rim = smoothstep(0.04, 0.3, length(vec2(mx - m, my - m)));
      col += vec3(0.05, 0.055, 0.065) * rim * (1.0 - clearAmt);

      // 内侧的水痕水珠
      for (int i = 0; i < 4; i++) {
        vec4 dp = uDrip[i];
        if (dp.w <= 0.0) continue;
        vec2 dd = (uv - dp.xy) * vec2(aspect, 1.0) / dp.z;
        dd.y *= dd.y < 0.0 ? 0.85 : 1.05;
        float r = length(dd);
        if (r >= 1.0) continue;
        float a = (1.0 - smoothstep(0.75, 1.0, r)) * dp.w;
        vec3 n3 = normalize(vec3(dd, sqrt(max(1.0 - r * r, 0.0))));
        float spec = pow(max(dot(n3, normalize(vec3(-0.35, -0.65, 0.68))), 0.0), 22.0);
        vec3 head = col * (0.55 + 0.6 * n3.z) + vec3(0.9, 0.93, 1.0) * spec * 0.7;
        col = mix(col, head, a);
      }

      // 暗角 + 色调映射 + 抖动
      vec2 q = uv - 0.5;
      col *= 1.0 - dot(q, q) * 0.7;
      col = 1.0 - exp(-col * 1.35);
      col += (hash2(gl_FragCoord.xy + fract(uTime * 7.0) * 100.0) - 0.5) * (1.5 / 255.0);
      gl_FragColor = vec4(col, 1.0);
    }`;

  let gl = null, prog = null, maskTex = null, dropTex = null, uni = {};
  let maskTexW = 0, maskTexH = 0;
  let renderScale = 1;
  let contextLost = false;

  function compile(type, src) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(sh) || 'shader compile failed');
    }
    return sh;
  }

  function makeTex(unit) {
    const t = gl.createTexture();
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    return t;
  }

  function setupGL() {
    const opts = { antialias: false, alpha: false, depth: false, stencil: false, premultipliedAlpha: false, powerPreference: 'high-performance' };
    gl = canvas.getContext('webgl', opts) || canvas.getContext('experimental-webgl', opts);
    if (!gl) return false;
    try {
      prog = gl.createProgram();
      gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
      gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
    } catch (err) {
      console.warn('WebGL 初始化失败，改用 2D 渲染：', err);
      gl = null;
      return false;
    }
    gl.useProgram(prog);

    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'aPos');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    maskTex = makeTex(0);
    dropTex = makeTex(1);
    maskTexW = maskTexH = 0;

    uni = {
      mask: gl.getUniformLocation(prog, 'uMask'),
      drops: gl.getUniformLocation(prog, 'uDrops'),
      texel: gl.getUniformLocation(prog, 'uMaskTexel'),
      view: gl.getUniformLocation(prog, 'uView'),
      time: gl.getUniformLocation(prog, 'uTime'),
      drip: gl.getUniformLocation(prog, 'uDrip'),
    };
    gl.uniform1i(uni.mask, 0);
    gl.uniform1i(uni.drops, 1);
    return true;
  }

  function renderGL(t) {
    gl.viewport(0, 0, canvas.width, canvas.height);

    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, maskTex);
    if (maskTexW !== mcols || maskTexH !== mrows) {
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, mcols, mrows, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, mask8);
      maskTexW = mcols; maskTexH = mrows;
    } else {
      gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, mcols, mrows, gl.LUMINANCE, gl.UNSIGNED_BYTE, mask8);
    }

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, dropTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, dropCanvas);

    gl.uniform2f(uni.texel, 1 / mcols, 1 / mrows);
    gl.uniform2f(uni.view, viewW, viewH);
    gl.uniform1f(uni.time, t);
    gl.uniform4fv(uni.drip, dripData);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ---------------------------------------------------------------------------
  // 不支持 WebGL 时的 2D 渲染：预先画好清晰 / 模糊两版城市，用遮罩合成
  // ---------------------------------------------------------------------------
  let ctx2d = null;
  let cityC = null, fogC = null, tmpC = null, maskC = null, maskImg = null;

  function paintCity(g, w, h) {
    const sky = g.createLinearGradient(0, 0, 0, h * 0.62);
    sky.addColorStop(0, '#04050b');
    sky.addColorStop(1, '#2b181c');
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h);
    g.fillStyle = '#07080c';
    g.fillRect(0, h * 0.765, w, h);
    const layers = [[h / 14, h * 0.7, '#0b0c12', 0.55], [h / 7, h * 0.77, '#040508', 1]];
    for (const [bw, base, wall, bright] of layers) {
      for (let x = -bw * Math.random(); x < w; x += bw) {
        const top = base - h * rand(0.1, 0.5);
        const gap = bw * rand(0.04, 0.14);
        g.fillStyle = wall;
        g.fillRect(x + gap, top, bw - gap * 2, h * 0.765 - top);
        const wy = h / (bright < 1 ? 72 : 46);
        const ncol = 3 + Math.floor(Math.random() * 4);
        const wx = (bw - gap * 2) / ncol;
        for (let yy = top + wy; yy < h * 0.76 - wy; yy += wy) {
          for (let c = 0; c < ncol; c++) {
            if (Math.random() < 0.6) continue;
            g.fillStyle = Math.random() < 0.7 ? `rgba(255,170,85,${0.5 * bright})` : `rgba(140,185,255,${0.5 * bright})`;
            g.fillRect(x + gap + c * wx + wx * 0.22, yy + wy * 0.28, wx * 0.56, wy * 0.44);
          }
        }
      }
    }
    const colors = ['255,140,40', '255,30,20', '255,225,185', '255,60,150', '50,210,255'];
    for (let i = 0; i < 26; i++) {
      const x = rand(0, w), y = h * rand(0.5, 0.86), r = Math.min(w, h) * rand(0.015, 0.045);
      const grad = g.createRadialGradient(x, y, 0, x, y, r);
      const c = colors[(Math.random() * colors.length) | 0];
      grad.addColorStop(0, `rgba(${c},0.75)`);
      grad.addColorStop(0.8, `rgba(${c},0.5)`);
      grad.addColorStop(1, `rgba(${c},0)`);
      g.fillStyle = grad;
      g.beginPath();
      g.arc(x, y, r, 0, Math.PI * 2);
      g.fill();
    }
  }

  function setup2D() {
    const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
    cityC = mk(viewW, viewH);
    paintCity(cityC.getContext('2d'), viewW, viewH);
    fogC = mk(viewW, viewH);
    const fg = fogC.getContext('2d');
    if ('filter' in fg) fg.filter = 'blur(10px)';
    fg.drawImage(cityC, 0, 0);
    fg.filter = 'none';
    fg.fillStyle = 'rgba(120,130,150,0.42)';
    fg.fillRect(0, 0, viewW, viewH);
    tmpC = mk(viewW, viewH);
    maskC = mk(mcols, mrows);
    maskImg = maskC.getContext('2d').createImageData(mcols, mrows);
  }

  function render2D() {
    if (!cityC || cityC.width !== viewW || cityC.height !== viewH || maskC.width !== mcols) setup2D();
    ctx2d.drawImage(cityC, 0, 0);
    ctx2d.fillStyle = 'rgba(210,225,255,0.18)';
    for (const d of drops) {
      ctx2d.beginPath();
      ctx2d.arc(d.x, d.y, d.r, 0, Math.PI * 2);
      ctx2d.fill();
    }
    const px = maskImg.data;
    for (let k = 0; k < mask8.length; k++) px[k * 4 + 3] = 255 - mask8[k];
    maskC.getContext('2d').putImageData(maskImg, 0, 0);
    const tg = tmpC.getContext('2d');
    tg.globalCompositeOperation = 'copy';
    tg.drawImage(fogC, 0, 0);
    tg.globalCompositeOperation = 'destination-in';
    tg.imageSmoothingEnabled = true;
    tg.drawImage(maskC, 0, 0, viewW, viewH);
    tg.globalCompositeOperation = 'source-over';
    ctx2d.drawImage(tmpC, 0, 0);
  }

  // 选择渲染器（须在绑定事件之前，因为降级时可能要换一块新画布）
  if (!setupGL()) {
    ctx2d = canvas.getContext('2d');
    if (!ctx2d) {
      const fresh = canvas.cloneNode(false);
      canvas.parentNode.replaceChild(fresh, canvas);
      canvas = fresh;
      ctx2d = canvas.getContext('2d');
    }
  }

  // ---------------------------------------------------------------------------
  // 尺寸与分辨率
  // ---------------------------------------------------------------------------
  const MAX_PIXELS = 1.1e6;

  function pickScale() {
    const dpr = window.devicePixelRatio || 1;
    return Math.max(0.5, Math.min(dpr, 2, Math.sqrt(MAX_PIXELS / Math.max(1, viewW * viewH))));
  }

  function applyCanvasSize() {
    const s = gl ? renderScale : 1;
    canvas.width = Math.max(1, Math.round(viewW * s));
    canvas.height = Math.max(1, Math.round(viewH * s));
  }

  function resize() {
    const w = canvas.clientWidth || window.innerWidth;
    const h = canvas.clientHeight || window.innerHeight;
    if (w === viewW && h === viewH) return;
    viewW = w; viewH = h;
    sizeK = Math.max(0.8, Math.min(2, Math.min(viewW, viewH) / 390));
    renderScale = pickScale();
    initMask();
    initDrops();
    drips = [];
    sizeDropCanvas();
    applyCanvasSize();
    perf.reset();
  }

  const perf = {
    frames: 0, total: 0,
    reset() { this.frames = 0; this.total = 0; },
    sample(dt) {
      if (!gl || dt > 0.25) return;
      this.frames++; this.total += dt;
      if (this.frames < 90) return;
      const avg = this.total / this.frames;
      this.reset();
      if (avg > 0.024 && renderScale > 0.6) {
        renderScale = Math.max(0.6, renderScale * 0.78);
        applyCanvasSize();
      }
    },
  };

  // ---------------------------------------------------------------------------
  // 交互：手指擦玻璃
  // ---------------------------------------------------------------------------
  const pointers = new Map();
  let touched = false;

  function brushR() {
    return Math.max(16, Math.min(viewW, viewH) * 0.055);
  }

  function interacted() {
    if (touched) return;
    touched = true;
    hint.classList.add('hide');
  }

  function wipeAt(x, y) {
    const r = brushR();
    stampMask(x, y, r, WIPE_VALUE);
    for (const d of drips) {
      if (!d.fading && Math.hypot(d.x - x, d.y - y) < r) { d.fading = true; d.alpha = 0; }
    }
  }

  function wipeLine(x0, y0, x1, y1) {
    const dist = Math.hypot(x1 - x0, y1 - y0);
    const n = Math.max(1, Math.min(100, Math.ceil(dist / (brushR() * 0.3))));
    for (let s = 1; s <= n; s++) wipeAt(x0 + ((x1 - x0) * s) / n, y0 + ((y1 - y0) * s) / n);
  }

  function localPos(e) {
    const r = canvas.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (canvas.setPointerCapture) {
      try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* 忽略 */ }
    }
    const [x, y] = localPos(e);
    pointers.set(e.pointerId, { x, y, lowX: x, lowY: y });
    wipeAt(x, y);
    interacted();
  });

  canvas.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const [x, y] = localPos(e);
    wipeLine(p.x, p.y, x, y);
    p.x = x; p.y = y;
    if (y > p.lowY) { p.lowX = x; p.lowY = y; }
  });

  function release(e) {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    pointers.delete(e.pointerId);
    // 被手指推到擦痕下沿的水汽，有时会汇成一道水痕流下去
    if (e.type === 'pointerup' && Math.random() < 0.6) spawnDrip(p.lowX, p.lowY + brushR() * 0.8);
  }
  canvas.addEventListener('pointerup', release);
  canvas.addEventListener('pointercancel', release);

  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('dblclick', (e) => e.preventDefault());
  document.addEventListener('contextmenu', (e) => e.preventDefault());

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 200));
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

  // ---------------------------------------------------------------------------
  // 主循环
  // ---------------------------------------------------------------------------
  let last = 0;
  const start = performance.now();

  function frame(now) {
    requestAnimationFrame(frame);
    if (contextLost) return;

    const dt = last ? Math.min((now - last) / 1000, 0.1) : 1 / 60;
    last = now;
    perf.sample(dt);

    decayMask(dt);
    updateDrops(dt);
    updateDrips(dt, now);
    encodeMask();

    const t = ((now - start) / 1000) % 1000;
    if (gl) {
      drawDrops();
      renderGL(t);
    } else {
      render2D();
    }
  }

  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    contextLost = true;
  });
  canvas.addEventListener('webglcontextrestored', () => {
    setupGL();
    contextLost = false;
  });

  document.addEventListener('visibilitychange', () => {
    last = 0;
    perf.reset();
  });

  resize();
  nextDrip = performance.now() + 3000;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
