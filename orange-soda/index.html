<style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const V3 = THREE.Vector3;
const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ------------------------------------------------------------------ *
 *  World constants  (1 unit = 10 cm)
 * ------------------------------------------------------------------ */
const GRAV = 98.1;
const SUN_ELEV = 25 * DEG, SUN_AZ = 38 * DEG;
const SUN_DIR = new V3(-Math.sin(SUN_AZ) * Math.cos(SUN_ELEV), Math.sin(SUN_ELEV), -Math.cos(SUN_AZ) * Math.cos(SUN_ELEV));
const SUN_COLOR = new THREE.Color(1.0, 0.68, 0.40);
const SUN_INTENSITY = 4.4;
const WIN = { z: -12, x0: -20, x1: 3, y0: 1.0, y1: 13.5, m1: -14.2, m2: 0.9, ty: 9.6, hw: 0.18 };
const ROOM = { x0: -26, x1: 26, y0: -7.4, y1: 18, z0: -12, z1: 24 };
const TABLE = { x0: -8.5, x1: 9.5, z0: -11.6, z1: 8.5, th: 0.36 };
const WOOD_SPAN = 12;

const BOT = { H: 2.31, yb: 0.08, Ri: 0.288, Ro: 0.31, mouthR: 0.088, fill0: 1.30, capY: 2.255 };
const CUP = { H: 1.08, yb: 0.12, r0: 0.32, r1: 0.378, ro0: 0.345, ro1: 0.40 };
const CUP_POS = new V3(1.32, 0, -0.42);
const ORANGE_POS = new V3(-1.0, 0, 0.62);
const ORANGE_R = 0.36;

function bottleOuterR(y) {
  let r = lerp(0.31, 0.138, smooth(1.20, 1.68, y));
  r -= 0.008 * smooth(1.68, 2.16, y);
  r = lerp(r, 0.148, smooth(2.20, 2.235, y));
  return r;
}
function bottleInnerR(y) {
  let r = lerp(0.288, 0.104, smooth(1.21, 1.70, y));
  r -= 0.016 * smooth(1.70, 2.20, y);
  return r;
}
const cupInnerR = (y) => lerp(CUP.r0, CUP.r1, clamp((y - CUP.yb) / (CUP.H - CUP.yb), 0, 1));
const cupOuterR = (y) => lerp(CUP.ro0, CUP.ro1, clamp(y / CUP.H, 0, 1));

/* ------------------------------------------------------------------ *
 *  Quality presets
 * ------------------------------------------------------------------ */
const DPR = window.devicePixelRatio || 1;
const QUALITY = {
  high:   { key: 'high',   name: '高', pr: Math.min(DPR, 1.5), msaa: 4, shadow: 2048, caustic: 1024, gridU: 120, gridV: 320, foam: 4800, bubbles: 1500, env: 256, bloom: 5 },
  medium: { key: 'medium', name: '中', pr: Math.min(DPR, 1.0), msaa: 0, shadow: 1024, caustic: 512,  gridU: 70,  gridV: 190, foam: 2400, bubbles: 800,  env: 128, bloom: 4 },
};
let Q = QUALITY.high;

/* ------------------------------------------------------------------ *
 *  Renderer
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false, stencil: false, powerPreference: 'high-performance' });
if (!renderer.capabilities.isWebGL2) {
  document.getElementById('loading').innerHTML = '<span>这个浏览器不支持 WebGL2，换个新一点的浏览器试试</span>';
  throw new Error('WebGL2 required');
}
renderer.setPixelRatio(Q.pr);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.autoClear = false;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
document.body.appendChild(renderer.domElement);
const canvasEl = renderer.domElement;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 300);
const HERO = { target: new V3(0.32, 1.22, 0.12), dist: 7.7, polar: 76.5 * DEG, az: 13 * DEG };
function camFromSph(target, dist, polar, az, out = camera.position) {
  return out.set(
    target.x + dist * Math.sin(polar) * Math.sin(az),
    target.y + dist * Math.cos(polar),
    target.z + dist * Math.sin(polar) * Math.cos(az));
}
// keep the 16:9 framing on narrow / portrait screens: widen the lens a bit, then step back
const BASE_HFOV = 2 * Math.atan(Math.tan(15 * DEG) * 16 / 9);
let viewScale = 1;
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  // portrait screens only need the orange-bottle-glass group across, not the whole table
  const hfov = lerp(34 * DEG, BASE_HFOV, smooth(0.7, 1.6, aspect));
  const vfov = clamp(2 * Math.atan(Math.tan(hfov / 2) / aspect), 30 * DEG, 46 * DEG);
  camera.fov = vfov / DEG;
  camera.aspect = aspect;
  viewScale = Math.max(1, Math.tan(hfov / 2) / (Math.tan(vfov / 2) * aspect));
  camera.updateProjectionMatrix();
}
fitCamera();
camFromSph(HERO.target, HERO.dist * viewScale, HERO.polar, HERO.az);
camera.lookAt(HERO.target);

/* ------------------------------------------------------------------ *
 *  Shared uniforms + GLSL
 * ------------------------------------------------------------------ */
const blackTex = new THREE.DataTexture(new Uint8Array([0, 0, 0, 255]), 1, 1);
blackTex.needsUpdate = true;
const U = {
  uSunDir: { value: SUN_DIR.clone() },
  uSunRad: { value: new V3(SUN_COLOR.r, SUN_COLOR.g, SUN_COLOR.b).multiplyScalar(SUN_INTENSITY) },
  uWinRect: { value: new THREE.Vector4(WIN.x0, WIN.x1, WIN.y0, WIN.y1) },
  uWinBars: { value: new THREE.Vector4(WIN.m1, WIN.m2, WIN.ty, WIN.hw) },
  uWinZ: { value: WIN.z },
  uTime: { value: 0 },
  uAmb: { value: new V3(0.07, 0.068, 0.075) },
  uFoamAmb: { value: new V3(0.56, 0.45, 0.36) },
  uEnv: { value: null },
  uScene: { value: blackTex },
  uViewProj: { value: new THREE.Matrix4() },
  uBotInv: { value: new THREE.Matrix4() },
  uCupInv: { value: new THREE.Matrix4() },
  uCupLevel: { value: 0 },
  uCaustic: { value: blackTex },
  uCausticRect: { value: new THREE.Vector4(-3, -3, 1 / 8, 1 / 8) },
  uWet: { value: blackTex },
  uWetRect: { value: new THREE.Vector4(-3, -3, 1 / 8, 1 / 8) },
};

const GLSL_COMMON = /* glsl */`
  #define SD_TAU 6.283185307
  uniform vec3 uSunDir;
  uniform vec3 uSunRad;
  uniform vec4 uWinRect;
  uniform vec4 uWinBars;
  uniform float uWinZ;
  uniform float uTime;
  uniform vec3 uAmb;

  float sdHash12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  float sdHash13(vec3 p3) { p3 = fract(p3 * 0.1031); p3 += dot(p3, p3.zyx + 31.32); return fract((p3.x + p3.y) * p3.z); }
  vec2 sdHash22(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973)); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.xx + p3.yz) * p3.zy); }
  float sdNoise2(vec2 p) {
    vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(sdHash12(i), sdHash12(i + vec2(1.0, 0.0)), u.x), mix(sdHash12(i + vec2(0.0, 1.0)), sdHash12(i + vec2(1.0, 1.0)), u.x), u.y);
  }
  float sdNoise3(vec3 x) {
    vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
    return mix(mix(mix(sdHash13(i), sdHash13(i + vec3(1,0,0)), f.x), mix(sdHash13(i + vec3(0,1,0)), sdHash13(i + vec3(1,1,0)), f.x), f.y),
               mix(mix(sdHash13(i + vec3(0,0,1)), sdHash13(i + vec3(1,0,1)), f.x), mix(sdHash13(i + vec3(0,1,1)), sdHash13(i + vec3(1,1,1)), f.x), f.y), f.z);
  }
  float sdBand(float lo, float hi, float s, float x) { return smoothstep(lo - s, lo + s, x) * (1.0 - smoothstep(hi - s, hi + s, x)); }

  // sunlight that makes it through the window (frame, mullions, a bit of foliage outside)
  float sdWindow(vec3 p) {
    float t = (uWinZ - p.z) / uSunDir.z;
    if (t <= 0.0) return 0.0;
    vec2 q = p.xy + uSunDir.xy * t;
    float s = 0.03 + 0.0095 * t;
    float m = sdBand(uWinRect.x, uWinRect.y, s, q.x) * sdBand(uWinRect.z, uWinRect.w, s, q.y);
    float hw = uWinBars.w;
    m *= smoothstep(hw - s, hw + s, abs(q.x - uWinBars.x));
    m *= smoothstep(hw - s, hw + s, abs(q.x - uWinBars.y));
    m *= smoothstep(hw - s, hw + s, abs(q.y - uWinBars.z));
    float n = sdNoise2(q * 0.42 + vec2(3.1, 7.7)) * 0.65 + sdNoise2(q * 1.1 - 1.7) * 0.35;
    m *= mix(1.0, smoothstep(0.18, 0.62, n), 0.32);
    return m;
  }

  float sdBottleR(float y) {
    float r = mix(0.31, 0.138, smoothstep(1.20, 1.68, y));
    r -= 0.008 * smoothstep(1.68, 2.16, y);
    r = mix(r, 0.148, smoothstep(2.20, 2.235, y));
    return r;
  }
  float sdBottleInnerR(float y) {
    float r = mix(0.288, 0.104, smoothstep(1.21, 1.70, y));
    r -= 0.016 * smoothstep(1.70, 2.20, y);
    return r;
  }
  float sdCupR(float y) { return mix(${CUP.ro0.toFixed(3)}, ${CUP.ro1.toFixed(3)}, clamp(y / ${CUP.H.toFixed(3)}, 0.0, 1.0)); }
  float sdCupInnerR(float y) { return mix(${CUP.r0.toFixed(3)}, ${CUP.r1.toFixed(3)}, clamp((y - ${CUP.yb.toFixed(3)}) / ${(CUP.H - CUP.yb).toFixed(3)}, 0.0, 1.0)); }
`;

// soft analytic shadow cast by a glass container onto a point (light that is
// not blocked; the light that goes *through* the container arrives via the caustic map)
const GLSL_OCCLUDE = /* glsl */`
  float sdContainerVis(vec3 pw, mat4 inv, float H, float Rb, float kind) {
    vec3 o = (inv * vec4(pw, 1.0)).xyz;
    vec3 d = normalize(mat3(inv) * uSunDir);
    float mg = 0.12;
    float R = Rb + mg;
    float a = dot(d.xz, d.xz), b = dot(o.xz, d.xz), c = dot(o.xz, o.xz) - R * R;
    float t0 = 0.0, t1 = 1e4;
    if (a < 1e-6) { if (c > 0.0) return 1.0; }
    else {
      float disc = b * b - a * c;
      if (disc < 0.0) return 1.0;
      float sq = sqrt(disc);
      t0 = (-b - sq) / a; t1 = (-b + sq) / a;
    }
    if (abs(d.y) > 1e-5) {
      float ta = (-mg - o.y) / d.y, tb = (H + mg - o.y) / d.y;
      t0 = max(t0, min(ta, tb)); t1 = min(t1, max(ta, tb));
    } else if (o.y < -mg || o.y > H + mg) return 1.0;
    t0 = max(t0, 0.0);
    if (t1 <= t0) return 1.0;
    float best = 1e3, tBest = t0;
    float tc = a > 1e-6 ? clamp(-b / a, t0, t1) : t0;
    for (int i = 0; i < 10; i++) {
      float t = i == 9 ? tc : mix(t0, t1, (float(i) + 0.5) / 9.0);
      vec3 q = o + d * t;
      float r = kind < 0.5 ? sdBottleR(q.y) : sdCupR(q.y);
      float dist = length(q.xz) - r;
      dist = max(dist, max(-q.y, q.y - H));
      if (dist < best) { best = dist; tBest = t; }
    }
    float pen = 0.003 + 0.0105 * tBest;
    return smoothstep(-pen, pen, best);
  }
`;

/* ------------------------------------------------------------------ *
 *  Fullscreen helpers
 * ------------------------------------------------------------------ */
const fsCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const fsGeo = new THREE.BufferGeometry();
fsGeo.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
fsGeo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));
const fsMesh = new THREE.Mesh(fsGeo);
fsMesh.frustumCulled = false;
const fsScene = new THREE.Scene();
fsScene.add(fsMesh);
const FS_VERT = /* glsl */`varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
function fsMat(frag, uniforms, extra = {}) {
  return new THREE.ShaderMaterial(Object.assign({ uniforms, vertexShader: FS_VERT, fragmentShader: frag, depthTest: false, depthWrite: false }, extra));
}
function fsPass(material, target) {
  fsMesh.material = material;
  renderer.setRenderTarget(target);
  renderer.render(fsScene, fsCam);
}

/* ------------------------------------------------------------------ *
 *  Procedural textures
 * ------------------------------------------------------------------ */
const WOOD_GLSL = /* glsl */`
  varying vec2 vUv;
  uniform float uMode;
  uniform float uTexel;
  float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
  float vn(vec2 p) {
    vec2 i = floor(p), f = fract(p); vec2 u = f * f * (3.0 - 2.0 * f);
    return mix(mix(h12(i), h12(i + vec2(1.0, 0.0)), u.x), mix(h12(i + vec2(0.0, 1.0)), h12(i + vec2(1.0, 1.0)), u.x), u.y);
  }
  float fbm(vec2 p) { float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * vn(p); p = p * 2.03 + 11.7; a *= 0.5; } return s; }
  // wood for texture coordinate p in [0, 12) x [0, 12)
  void wood(vec2 p, out vec3 alb, out float rough, out float h) {
    const float PW = 1.5;
    float j = floor(p.y / PW);
    float o = h12(vec2(j, 4.7)) * 12.0;
    float sx = p.x + o;
    float seg = floor(sx / 12.0);
    float bx = sx - seg * 12.0;
    float by = p.y - j * PW;
    float seed = h12(vec2(j, 17.3));
    float seed2 = h12(vec2(j, 41.9));
    float seed3 = h12(vec2(j, 73.1));
    // growth rings: a pith running along the board at a varying depth -> cathedral arches
    float c = PW * (0.15 + 0.7 * seed);
    float depth = 0.12 + 0.5 * seed2 + 0.25 * sin(bx * (0.25 + 0.2 * seed3) + seed * 6.28) + (seed3 - 0.5) * 0.08 * (bx - 6.0);
    float lat = by - c + 0.06 * (fbm(vec2(bx * 0.5, by * 1.5 + seed * 9.0)) - 0.5);
    float rad = sqrt(lat * lat + depth * depth);
    float rr = rad * (7.0 + 7.0 * seed2) + 0.6 * fbm(vec2(bx * 0.7, by * 3.0 + seed * 5.0));
    float ring = fract(rr);
    float late = smoothstep(0.62, 0.86, ring) * (1.0 - smoothstep(0.9, 0.995, ring));
    float streak = fbm(vec2(bx * 0.6, by * 30.0 + seed * 13.0));
    float pores = smoothstep(0.6, 0.86, vn(vec2(bx * 5.0, by * 150.0 + seed * 31.0)));
    vec3 light = vec3(0.235, 0.118, 0.050);
    vec3 dark = vec3(0.085, 0.036, 0.014);
    vec3 tint = mix(vec3(1.0), vec3(1.1, 0.96, 0.86), seed) * mix(0.8, 1.12, seed2);
    alb = mix(light, dark, late * 0.8 + (streak - 0.5) * 0.45) * tint;
    alb *= 1.0 - 0.22 * pores;
    alb *= 0.88 + 0.24 * fbm(vec2(bx * 0.2, by * 0.9 + seed * 5.0));
    float ex = min(bx, 12.0 - bx), ey = min(by, PW - by);
    float gap = smoothstep(0.0, 0.006, ex) * smoothstep(0.0, 0.005, ey);
    float bevel = smoothstep(0.0, 0.018, ex) * smoothstep(0.0, 0.018, ey);
    alb *= mix(0.4, 1.0, gap) * mix(0.82, 1.0, bevel);
    rough = 0.42 + 0.1 * late + 0.14 * pores + 0.08 * (fbm(vec2(bx * 1.7, by * 3.0)) - 0.5);
    rough = mix(0.85, rough, gap);
    h = -0.2 * late - 0.35 * pores + 0.06 * streak - 1.2 * (1.0 - bevel);
  }
  void main() {
    vec2 p = vUv * 12.0;
    vec3 alb; float rough; float h;
    wood(p, alb, rough, h);
    if (uMode < 0.5) {
      gl_FragColor = vec4(alb, rough);
    } else {
      float e = uTexel * 12.0;
      vec3 a2; float r2; float hx, hz, hx0, hz0;
      wood(p + vec2(e, 0.0), a2, r2, hx);
      wood(p - vec2(e, 0.0), a2, r2, hx0);
      wood(p + vec2(0.0, e), a2, r2, hz);
      wood(p - vec2(0.0, e), a2, r2, hz0);
      vec2 g = vec2(hx - hx0, hz - hz0) / (2.0 * e);
      vec3 n = normalize(vec3(-g * 0.0009, 1.0));
      gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
    }
  }
`;

function genWood() {
  const S = 2048;
  const opts = { generateMipmaps: true, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, depthBuffer: false, anisotropy: MAX_ANISO };
  const albedo = new THREE.WebGLRenderTarget(S, S, Object.assign({ colorSpace: THREE.SRGBColorSpace }, opts));
  const normal = new THREE.WebGLRenderTarget(S, S, opts);
  const mat = fsMat(WOOD_GLSL, { uMode: { value: 0 }, uTexel: { value: 1 / S } });
  fsPass(mat, albedo);
  mat.uniforms.uMode.value = 1;
  fsPass(mat, normal);
  mat.dispose();
  return { albedo: albedo.texture, normal: normal.texture };
}

// condensation on the cold bottle: droplet normals (rg), coverage (b), micro-fog (a)
function genCondensation(W, H, seed) {
  const rnd = mulberry32(seed);
  const hgt = new Float32Array(W * H);
  const cov = new Float32Array(W * H);
  const fog = new Float32Array(W * H);
  const H_UNITS = 2.25;
  for (let y = 0; y < H; y++) {
    const yu = (y + 0.5) / H * H_UNITS;
    // colder (more fog) where the liquid is, thinner on the shoulder / neck
    const base = 0.95 - 0.55 * smooth(1.25, 1.9, yu) - 0.4 * smooth(0.0, 0.08, 0.08 - yu);
    for (let x = 0; x < W; x++) fog[y * W + x] = base;
  }
  // low-frequency patchiness
  const blobs = 70;
  for (let k = 0; k < blobs; k++) {
    const cx = rnd() * W, cy = rnd() * H, r = (0.04 + rnd() * 0.12) * W, s = (rnd() - 0.6) * 0.5;
    const x0 = Math.floor(cx - r), x1 = Math.ceil(cx + r), y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(H - 1, Math.ceil(cy + r));
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
      const d = Math.hypot(x - cx, y - cy) / r;
      if (d >= 1) continue;
      const i = y * W + ((x % W) + W) % W;
      fog[i] = clamp(fog[i] + s * (1 - d * d) * (1 - d * d), 0, 1);
    }
  }
  function stamp(cx, cy, r, ry, dry) {
    const x0 = Math.floor(cx - r * 1.8), x1 = Math.ceil(cx + r * 1.8);
    const y0 = Math.max(0, Math.floor(cy - ry * 1.8)), y1 = Math.min(H - 1, Math.ceil(cy + ry * 1.8));
    for (let y = y0; y <= y1; y++) {
      const dy = (y + 0.5 - cy) / ry;
      for (let x = x0; x <= x1; x++) {
        const dx = (x + 0.5 - cx) / r;
        const d2 = dx * dx + dy * dy;
        const i = y * W + ((x % W) + W) % W;
        if (d2 < 1) {
          const h = Math.sqrt(1 - d2) * r * 0.85;
          if (h > hgt[i]) hgt[i] = h;
          cov[i] = 1;
          fog[i] = 0;
        } else if (d2 < dry) {
          fog[i] *= smooth(1.0, dry, d2);
        }
      }
    }
  }
  const yOf = (u) => u / H_UNITS * H;
  // drip trails: clear streaks with a beaded line and a fat drop at the end
  for (let k = 0; k < 16; k++) {
    let x = rnd() * W;
    const yStart = yOf(0.25 + rnd() * 1.2);
    const len = yOf(0.12 + rnd() * 0.45);
    const w = 1.5 + rnd() * 2.0;
    let y = yStart;
    while (y > yStart - len && y > 2) {
      for (let xx = Math.floor(x - w * 2); xx <= Math.ceil(x + w * 2); xx++) {
        const d = Math.abs(xx - x) / w;
        const i = Math.floor(y) * W + ((xx % W) + W) % W;
        fog[i] *= 0.45 + 0.55 * smooth(0.6, 1.6, d);
      }
      if (rnd() < 0.18) stamp(x + (rnd() - 0.5) * w, y, 0.8 + rnd() * 1.6, 0.8 + rnd() * 1.8, 1.8);
      x += (rnd() - 0.5) * 0.7;
      y -= 1;
    }
    const rr = 4 + rnd() * 5;
    stamp(x, y + rr * 0.3, rr, rr * 1.35, 2.2);
  }
  // big / medium / small droplets
  const place = (n, rMin, rMax, el, dry, yMaxU) => {
    for (let k = 0; k < n; k++) {
      const yu = Math.pow(rnd(), 0.8) * yMaxU;
      if (rnd() > 0.35 + 0.65 * (1 - smooth(1.3, 2.1, yu))) continue;
      const r = rMin + Math.pow(rnd(), 1.6) * (rMax - rMin);
      stamp(rnd() * W, yOf(yu), r, r * (1 + rnd() * el), dry);
    }
  };
  place(170, 5.5, 13, 0.35, 2.4, 2.1);
  place(1100, 2.6, 5.5, 0.2, 2.0, 2.2);
  place(7000, 0.9, 2.6, 0.1, 1.7, 2.25);
  const data = new Uint8Array(W * H * 4);
  for (let y = 0; y < H; y++) {
    const ym = Math.max(0, y - 1), yp = Math.min(H - 1, y + 1);
    for (let x = 0; x < W; x++) {
      const xm = (x + W - 1) % W, xp = (x + 1) % W;
      const i = y * W + x;
      let gx = (hgt[y * W + xp] - hgt[y * W + xm]) * 0.5;
      let gy = (hgt[yp * W + x] - hgt[ym * W + x]) * 0.5;
      gx = clamp(gx / 3, -1, 1); gy = clamp(gy / 3, -1, 1);
      data[i * 4] = Math.round(127.5 + gx * 127);
      data[i * 4 + 1] = Math.round(127.5 + gy * 127);
      data[i * 4 + 2] = Math.round(cov[i] * 255);
      data[i * 4 + 3] = Math.round(clamp(fog[i], 0, 1) * 255);
    }
  }
  const tex = new THREE.DataTexture(data, W, H, THREE.RGBAFormat, THREE.UnsignedByteType);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.anisotropy = MAX_ANISO;
  tex.needsUpdate = true;
  return tex;
}

function genCapTexture() {
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  const cx = S / 2;
  const grad = g.createRadialGradient(cx, cx * 0.9, 10, cx, cx, cx);
  grad.addColorStop(0, '#ff8a2a');
  grad.addColorStop(0.6, '#f26a12');
  grad.addColorStop(1, '#c84d08');
  g.fillStyle = grad;
  g.fillRect(0, 0, S, S);
  // printed ring
  g.strokeStyle = '#fff3dc';
  g.lineWidth = 9;
  g.beginPath(); g.arc(cx, cx, S * 0.405, 0, TAU); g.stroke();
  g.lineWidth = 3;
  g.beginPath(); g.arc(cx, cx, S * 0.375, 0, TAU); g.stroke();
  // orange slice icon
  const oy = cx - S * 0.085, orr = S * 0.11;
  g.fillStyle = '#fff3dc';
  g.beginPath(); g.arc(cx, oy, orr, 0, TAU); g.fill();
  g.fillStyle = '#f5a12a';
  g.beginPath(); g.arc(cx, oy, orr * 0.8, 0, TAU); g.fill();
  g.strokeStyle = '#fff3dc';
  g.lineWidth = 3.5;
  for (let k = 0; k < 8; k++) {
    const a = k / 8 * TAU;
    g.beginPath(); g.moveTo(cx, oy); g.lineTo(cx + Math.cos(a) * orr * 0.8, oy + Math.sin(a) * orr * 0.8); g.stroke();
  }
  g.fillStyle = '#fff3dc';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = '700 52px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Zen Hei", sans-serif';
  g.fillText('橘子汽水', cx, cx + S * 0.1);
  g.font = '600 22px "Helvetica Neue", Arial, sans-serif';
  g.fillText('ORANGE  SODA', cx, cx + S * 0.19);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = MAX_ANISO;
  return tex;
}

// ---- background room (window with a golden-hour skyline, curtains, dim walls) ----
const BG_FRAG = /* glsl */`
  varying vec3 vW;
  vec3 sdSky(vec3 d) {
    float el = asin(clamp(d.y, -1.0, 1.0));
    float az = atan(d.x, -d.z);
    vec3 horizon = vec3(3.6, 1.65, 0.62);
    vec3 low = vec3(2.0, 0.88, 0.42);
    vec3 mid = vec3(0.85, 0.40, 0.33);
    vec3 high = vec3(0.30, 0.20, 0.30);
    vec3 c = mix(horizon, low, smoothstep(0.0, 0.07, el));
    c = mix(c, mid, smoothstep(0.07, 0.25, el));
    c = mix(c, high, smoothstep(0.25, 0.7, el));
    // soft cloud streaks
    float cl = sdNoise2(vec2(az * 3.0, el * 18.0) + 4.0) * 0.6 + sdNoise2(vec2(az * 7.0, el * 40.0)) * 0.4;
    c *= 1.0 + 0.35 * smoothstep(0.45, 0.8, cl) * smoothstep(0.03, 0.12, el) * (1.0 - smoothstep(0.3, 0.5, el));
    float cs = max(dot(d, uSunDir), 0.0);
    c += vec3(5.0, 2.4, 0.9) * pow(cs, 90.0) * 2.5 + vec3(1.6, 0.7, 0.25) * pow(cs, 9.0) + vec3(0.5, 0.22, 0.08) * pow(cs, 3.0);
    // distant hazy skyline (blocks + trees), already out of focus
    float bx = az * 22.0;
    float blk = floor(bx);
    float fb = fract(bx);
    float bh = 0.010 + 0.024 * pow(sdHash12(vec2(blk, 2.0)), 2.0) * smoothstep(0.0, 0.25, fb) * smoothstep(1.0, 0.75, fb);
    bh = max(bh, 0.012 + 0.02 * sdNoise2(vec2(az * 7.0, 1.0)) + 0.008 * sdNoise2(vec2(az * 31.0, 5.0)));
    float sky_h = bh;
    float sil = 1.0 - smoothstep(sky_h - 0.016, sky_h + 0.016, el);
    vec3 cityCol = mix(vec3(0.55, 0.25, 0.11), vec3(0.95, 0.45, 0.17), smoothstep(-0.12, 0.0, el)) * 0.9;
    // tiny lit windows / glints
    c = mix(c, cityCol, sil);
    // out-of-focus bokeh
    for (int i = 0; i < 16; i++) {
      float fi = float(i);
      vec2 ctr = vec2(-1.05 + 1.25 * sdHash12(vec2(fi, 3.1)), -0.035 + 0.11 * pow(sdHash12(vec2(fi, 7.7)), 1.5));
      float rad = 0.012 + 0.03 * sdHash12(vec2(fi, 11.3));
      vec2 dd = vec2((az - ctr.x) * cos(el), el - ctr.y);
      float r = length(dd) / rad;
      float disc = 1.0 - smoothstep(0.84, 1.0, r);
      float rimb = smoothstep(0.6, 0.97, r) * disc;
      vec3 bc = mix(vec3(3.2, 1.6, 0.55), vec3(2.6, 1.0, 0.45), sdHash12(vec2(fi, 5.5)));
      c += bc * (disc * 0.28 + rimb * 0.22) * (0.35 + 0.65 * sdHash12(vec2(fi, 9.9)));
    }
    return c;
  }
  vec3 sdWallLight(vec3 p, vec3 n) {
    float near = exp(-max(p.z - uWinZ, 0.0) * 0.09);
    vec3 amb = vec3(0.05, 0.04, 0.035) + vec3(0.20, 0.10, 0.05) * near * (0.5 + 0.5 * n.z);
    float sunv = sdWindow(p) * max(dot(n, uSunDir), 0.0);
    return amb + uSunRad * sunv * 0.32;
  }
  void main() {
    vec3 p = vW;
    vec3 col;
    float s = 0.38;
    if (p.z < uWinZ + 0.05) {
      vec3 wall = vec3(0.42, 0.33, 0.25) * sdWallLight(p, vec3(0.0, 0.0, 1.0));
      float inWin = sdBand(uWinRect.x, uWinRect.y, s, p.x) * sdBand(uWinRect.z, uWinRect.w, s, p.y);
      float bars = 1.0 - smoothstep(uWinBars.w - s, uWinBars.w + s, abs(p.x - uWinBars.x));
      bars = max(bars, 1.0 - smoothstep(uWinBars.w - s, uWinBars.w + s, abs(p.x - uWinBars.y)));
      bars = max(bars, 1.0 - smoothstep(uWinBars.w - s, uWinBars.w + s, abs(p.y - uWinBars.z)));
      vec3 outside = sdSky(normalize(p - cameraPosition));
      vec3 frameCol = vec3(0.05, 0.03, 0.02) + vec3(0.35, 0.16, 0.06) * (1.0 - bars) * 0.6;
      col = mix(wall, mix(outside, frameCol, bars), inWin);
      // sill
      float sill = sdBand(uWinRect.x - 0.4, uWinRect.y + 0.4, s, p.x) * sdBand(uWinRect.z - 0.45, uWinRect.z + 0.05, 0.12, p.y);
      col = mix(col, vec3(0.55, 0.30, 0.15), sill * 0.8);
      // sheer curtains glowing in the light
      float cL = sdBand(-24.5, -18.4, 0.5, p.x), cR = sdBand(2.2, 6.8, 0.5, p.x);
      float folds = 0.55 + 0.45 * sin(p.x * 2.6 + sin(p.x * 0.9) * 1.5);
      float lit = sdBand(uWinRect.x - 2.0, uWinRect.y + 2.0, 1.2, p.x) * smoothstep(-1.0, 3.0, p.y);
      vec3 curtain = vec3(1.25, 0.70, 0.38) * folds * (0.25 + 1.1 * lit) * (0.8 + 0.2 * sdNoise2(p.xy * 0.4));
      col = mix(col, curtain, max(cL, cR) * 0.88 * smoothstep(-4.0, 0.5, p.y));
    } else if (p.y < ${ROOM.y0.toFixed(2)} + 0.05) {
      vec3 albedo = vec3(0.10, 0.055, 0.03) * (0.8 + 0.3 * sdNoise2(p.xz * vec2(0.5, 3.0)));
      col = albedo * sdWallLight(p, vec3(0.0, 1.0, 0.0)) * 1.6;
    } else if (p.y > ${ROOM.y1.toFixed(2)} - 0.05) {
      col = vec3(0.30, 0.25, 0.20) * sdWallLight(p, vec3(0.0, -1.0, 0.0)) * 0.6;
    } else {
      vec3 n = p.x < ${ROOM.x0.toFixed(1)} + 0.05 ? vec3(1.0, 0.0, 0.0) : (p.x > ${ROOM.x1.toFixed(1)} - 0.05 ? vec3(-1.0, 0.0, 0.0) : vec3(0.0, 0.0, -1.0));
      vec3 albedo = vec3(0.45, 0.36, 0.28);
      col = albedo * sdWallLight(p, n);
      // warm bounce from the sunlit table, strongest at table height
      col += vec3(0.16, 0.085, 0.04) * exp(-pow(p.y - 1.0, 2.0) * 0.012) * (0.6 + 0.4 * sdNoise2(p.xz * 0.15 + p.y * 0.1));
      if (p.x > ${ROOM.x1.toFixed(1)} - 0.1) {
        // right wall: a slanted patch of evening sun with a potted plant in front of it
        float sl = p.z - (p.y - 2.0) * 0.55;
        float sunPatch = sdBand(-1.0, 13.0, 1.1, sl) * sdBand(1.0, 10.0, 1.0, p.y);
        float leaves = smoothstep(0.52, 0.66, sdNoise2(vec2(p.z, p.y) * 0.55 + 4.0) * 0.7 + sdNoise2(vec2(p.z, p.y) * 1.4) * 0.3) * sdBand(2.0, 9.0, 1.5, p.z) * sdBand(-1.0, 6.5, 1.5, p.y);
        col += vec3(1.5, 0.82, 0.38) * sunPatch * (1.0 - 0.75 * leaves);
        col *= 1.0 - 0.6 * leaves * (1.0 - sunPatch);
      } else if (p.x < ${ROOM.x0.toFixed(1)} + 0.1) {
        // left wall: a framed print and a warm wall lamp
        float frame = sdBand(10.0, 16.0, 0.35, p.z) * sdBand(3.0, 8.0, 0.35, p.y);
        float inner = sdBand(10.5, 15.5, 0.3, p.z) * sdBand(3.5, 7.5, 0.3, p.y);
        col = mix(col, vec3(0.05, 0.035, 0.025), frame * 0.85);
        col = mix(col, vec3(0.42, 0.22, 0.12) * (0.7 + 0.5 * sdNoise2(vec2(p.z, p.y) * 0.8)), inner * 0.8);
        vec2 lp = vec2(p.z, p.y) - vec2(19.0, 7.0);
        col += vec3(2.2, 1.2, 0.5) * exp(-dot(lp, lp) * 0.35) + vec3(0.5, 0.26, 0.1) * exp(-dot(lp, lp) * 0.03);
      } else {
        // back wall: a bookshelf in soft focus
        float shelfRow = sdBand(-6.0, 7.0, 0.5, p.x) * sdBand(0.0, 11.0, 0.5, p.y);
        float rowY = fract(p.y / 2.6);
        float books = shelfRow * smoothstep(0.08, 0.2, rowY) * (1.0 - smoothstep(0.8, 0.9, rowY));
        float spine = sdHash12(vec2(floor(p.x * 2.2), floor(p.y / 2.6)));
        vec3 bookCol = mix(vec3(0.32, 0.12, 0.06), vec3(0.18, 0.2, 0.22), step(0.6, spine)) * (0.5 + 0.8 * spine);
        col = mix(col, bookCol * (sdWallLight(p, n) * 2.0 + 0.05), books * 0.85);
        col = mix(col, vec3(0.06, 0.04, 0.03), shelfRow * (1.0 - smoothstep(0.0, 0.1, rowY)) * 0.8);
      }
      // a warm picture frame / shelf blur on the back wall so reflections have structure
      float shelf = sdBand(-6.0, 8.0, 0.6, p.x) * sdBand(4.0, 4.6, 0.25, p.y) * step(20.0, p.z);
      col = mix(col, vec3(0.08, 0.05, 0.03), shelf * 0.6);
      float lamp = exp(-dot(p.xy - vec2(9.0, 9.0), p.xy - vec2(9.0, 9.0)) * 0.08) * step(20.0, p.z);
      col += vec3(0.9, 0.55, 0.25) * lamp * 0.6;
      // a big sunlit linen curtain behind the camera: gives the glass its soft strip highlights
      float card = sdBand(-8.0, -3.0, 0.5, p.x) * sdBand(-3.0, 13.0, 1.2, p.y) * step(20.0, p.z);
      col = mix(col, vec3(4.2, 3.2, 2.4), card);
      float card2 = sdBand(4.0, 9.0, 1.2, p.z) * sdBand(-2.0, 11.0, 1.5, p.y) * step(p.x, ${ROOM.x0.toFixed(1)} + 0.1);
      col = mix(col, vec3(1.1, 0.75, 0.5), card2 * 0.6);
    }
    gl_FragColor = vec4(col, 1.0);
  }
`;

const LIGHTS_BEGIN = THREE.ShaderChunk.lights_fragment_begin.replace(
  'getDirectionalLightInfo( directionalLight, directLight );',
  'getDirectionalLightInfo( directionalLight, directLight );\n\t\tdirectLight.color *= sdSunVis;');

function patchMaterial(mat, opt) {
  mat.onBeforeCompile = (sh) => {
    Object.assign(sh.uniforms, {
      uSunDir: U.uSunDir, uSunRad: U.uSunRad, uWinRect: U.uWinRect, uWinBars: U.uWinBars, uWinZ: U.uWinZ, uTime: U.uTime, uAmb: U.uAmb,
    }, opt.uniforms || {});
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vSdW;\nvarying vec3 vSdN;\nvarying vec3 vSdO;')
      .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvSdW = (modelMatrix * vec4(transformed, 1.0)).xyz;\nvSdN = normalize(mat3(modelMatrix) * objectNormal);\nvSdO = transformed;');
    let fs = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nvarying vec3 vSdW;\nvarying vec3 vSdN;\nvarying vec3 vSdO;\n' + GLSL_COMMON + (opt.pars || ''))
      .replace('#include <lights_fragment_begin>', (opt.sunVis || 'float sdSunVis = sdWindow(vSdW);') + '\n' + LIGHTS_BEGIN);
    for (const [k, v] of Object.entries(opt.replace || {})) fs = fs.replace(k, v);
    sh.fragmentShader = fs;
  };
  mat.customProgramCacheKey = () => opt.key;
  return mat;
}

      vec3 sdBumpN(vec3 surf_pos, vec3 surf_norm, float h) {

        float pith = smoothstep(0.915, 0.93, r) * (1.0 - smoothstep(0.962, 0.97, r));
        float zest = smoothstep(0.962, 0.97, r);
        col = pulp;
        col = mix(col, vec3(1.0, 0.72, 0.42), mem * 0.7);

        col = mix(col, vec3(0.97, 0.86, 0.64), pith);

        rough = mix(0.6, 0.3 + 0.25 * (1.0 - edge), pulpAmt);
        rough = mix(rough, 0.45, zest);
        h = (dome * edge) * 0.8 * pulpAmt - mem * 0.4 - pith * 0.1;

function makeCapGeometry() {
  const segs = 21 * 8;
  const prof = [
    [0.000, 0.0625, 0], [0.050, 0.0622, 0], [0.100, 0.0612, 0], [0.128, 0.0600, 0], [0.141, 0.0587, 0.05], [0.149, 0.0565, 0.15],
    [0.154, 0.0525, 0.3], [0.1565, 0.0465, 0.45], [0.158, 0.037, 0.6], [0.159, 0.027, 0.78], [0.1605, 0.017, 0.92],
    [0.1635, 0.008, 1.0], [0.1675, 0.0025, 1.0], [0.1690, 0.0, 1.0],
  ];
  const pos = [], uv = [], idx = [];
  for (let i = 0; i < prof.length; i++) {
    const [r0, y, amp] = prof[i];
    for (let j = 0; j <= segs; j++) {
      const a = j / segs * TAU;
      const f = Math.cos(a * 21);
      const flute = Math.sign(f) * Math.pow(Math.abs(f), 0.55);
      const r = r0 + amp * 0.0085 * flute;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      pos.push(x, y + amp * 0.0015 * flute, z);
      uv.push(0.5 + x / 0.36, 0.5 - z / 0.36);
    }
  }
  for (let i = 0; i < prof.length - 1; i++) {
    for (let j = 0; j < segs; j++) {
      const a = i * (segs + 1) + j, b = a + segs + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ------------------------------------------------------------------ *
 *  Glass + liquid shaders

const GLASS_VERT = /* glsl */`
  varying vec3 vL;
  varying vec3 vLN;
  varying vec3 vW;
  varying vec3 vNW;
  void main() {
    vL = position;
    vLN = normal;
    vec4 w = modelMatrix * vec4(position, 1.0);
    vW = w.xyz;
    vNW = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * viewMatrix * w;
  }
`;

const GLSL_SCENE = /* glsl */`
  uniform samplerCube uEnv;
  uniform sampler2D uScene;
  uniform mat4 uViewProj;
  vec3 sdSceneAt(vec3 pw, float lod) {
    vec4 c = uViewProj * vec4(pw, 1.0);
    vec2 uv = c.xy / max(c.w, 1e-3) * 0.5 + 0.5;
    uv = clamp(uv, vec2(0.002), vec2(0.998));
    return textureLod(uScene, uv, lod).rgb;
  }
  vec3 sdEnv(vec3 dir, float lod) { return textureLod(uEnv, dir, lod).rgb; }
  float sdFres(float c, float f0) { float m = 1.0 - clamp(c, 0.0, 1.0); float m2 = m * m; return f0 + (1.0 - f0) * m2 * m2 * m; }
`;

const GLASS_FRAG = /* glsl */`
  uniform mat4 uInv;
  uniform mat4 uModel;
  uniform float uBack;
  uniform float uKind;       // 0 bottle, 1 cup
  uniform float uCondOn;
  uniform float uFog;
  uniform sampler2D uCond;
  uniform float uBaseTop;
  uniform float uWall;
  varying vec3 vL;
  varying vec3 vLN;
  varying vec3 vW;
  varying vec3 vNW;
  void main() {
    bool back = uBack > 0.5;
    vec3 N = normalize(vNW);
    if (back) N = -N;
    vec3 V = normalize(cameraPosition - vW);
    float rl = length(vL.xz);
    float side = smoothstep(0.35, 0.6, abs(vLN.x) + abs(vLN.z));
    float theta = atan(vL.z, vL.x);
    float Ro = uKind < 0.5 ? sdBottleR(vL.y) : sdCupR(vL.y);
    bool inner = rl < Ro - uWall * 0.5;
    vec3 Tw = normalize(mat3(uModel) * vec3(-sin(theta), 0.0, cos(theta)));
    vec3 Bw = normalize(cross(Tw, N));
    vec3 Nd = N;
    float fog = 0.0, cover = 0.0, glen = 0.0;
    vec2 g = vec2(0.0);
    if (uCondOn > 0.5 && !inner) {
      vec4 c = texture2D(uCond, vec2(theta / SD_TAU + 0.5, vL.y / 2.25));
      float onBody = side * (1.0 - smoothstep(2.12, 2.2, vL.y)) * smoothstep(0.015, 0.05, vL.y);
      g = (c.rg * 2.0 - 1.0) * onBody;
      glen = length(g);
      Nd = normalize(N - (Tw * g.x + Bw * g.y) * (back ? -2.0 : 2.0));
      fog = c.a * uFog * onBody;
      cover = c.b * onBody;
    }
    float NdV = clamp(dot(Nd, V), 0.0, 1.0);
    float F = sdFres(NdV, cover > 0.5 ? 0.025 : 0.045);
    vec3 refl = sdEnv(reflect(-V, Nd), fog * 2.5);
    vec3 Hh = normalize(V + uSunDir);
    float ndh = max(dot(Nd, Hh), 0.0);
    float sunv = sdWindow(vW);
    vec3 spec = uSunRad * sunv * (pow(ndh, 3000.0) * 60.0 + pow(ndh, 260.0) * 1.0) * step(0.0, dot(Nd, uSunDir));
    // how much glass the eye looks through: dark, slightly green edges
    vec3 Vl = normalize(mat3(uInv) * V);
    float vl = max(length(Vl.xz), 0.12);
    float bimp = abs(vL.x * Vl.z - vL.z * Vl.x) / vl;
    float Ri = Ro - uWall;
    float Lxz = sqrt(max(Ro * Ro - bimp * bimp, 0.0)) - sqrt(max(Ri * Ri - bimp * bimp, 0.0));
    float Lg = inner ? 0.0 : mix(uWall / max(NdV, 0.2), Lxz / vl, side);
    vec3 Tg = exp(-vec3(3.4, 2.0, 2.6) * Lg);
    // droplets: dark refracting rims, a bright focused crescent, glints
    float rim = smoothstep(0.42, 0.95, glen) * cover;
    vec2 lt = vec2(dot(-uSunDir, Tw), dot(-uSunDir, Bw));
    float cres = cover * smoothstep(0.1, 0.65, glen) * pow(max(dot(normalize(-g + 1e-5), normalize(lt + 1e-5)), 0.0), 2.0);
    float backl = pow(max(dot(-V, uSunDir), 0.0), 2.0);
    vec3 dropGlow = uSunRad * sunv * cres * (0.06 + 0.5 * backl) * vec3(1.0, 0.82, 0.6);
    // micro-condensation haze
    vec3 fogCol = (uAmb * 2.2 + uSunRad * sunv * (0.03 + 0.3 * backl)) * vec3(0.96, 0.97, 1.0);
    float aFog = fog * 0.12;
    vec3 col = refl * F + spec + fogCol * aFog + dropGlow + vec3(0.004, 0.012, 0.008) * Lg * 10.0 * uAmb.g * 10.0;
    float trans = (1.0 - F) * (1.0 - aFog) * (1.0 - rim * 0.6);
    float a = 1.0 - trans * dot(Tg, vec3(0.3333));
    // thick glass base: the table seen through solid glass
    if (!back && !inner && vL.y < uBaseTop && side > 0.5) {
      float k = 1.0 - smoothstep(uBaseTop - 0.025, uBaseTop, vL.y);
      vec3 nv = normalize((viewMatrix * vec4(N, 0.0)).xyz);
      vec4 cl = uViewProj * vec4(vW, 1.0);
      vec2 suv = cl.xy / cl.w * 0.5 + 0.5 - nv.xy * 0.035;
      vec3 thru = textureLod(uScene, clamp(suv, 0.002, 0.998), 1.0).rgb * vec3(0.8, 0.88, 0.82) * (1.0 - F);
      col += thru * k;
      a = mix(a, 1.0, k);
    }
    gl_FragColor = vec4(col, a);
  }
`;

function makeGlassMaterial(kind, back) {
  return new THREE.ShaderMaterial({
    uniforms: {

// ---- liquid ----
const LIQ_PARS = /* glsl */`
  uniform mat4 uInv;
  uniform mat4 uModel;
  uniform vec3 uPN;
  uniform float uPD;
  uniform float uWaveAmp;
  uniform sampler2D uWave;
  uniform float uWaveScale;
  uniform float uRi;
  uniform float uYb;
  uniform float uYTop;
  uniform float uTurb;
  uniform float uFoamH;
  uniform float uSunVisC;
  uniform float uKind;
  uniform float uCondOn;
  uniform sampler2D uCond;
  uniform vec3 uAbs;
  uniform vec3 uFoamAmb;
  vec3 sdFoamCells(vec2 p) {
    vec2 ip = floor(p), fp = fract(p);
    float d1 = 8.0, d2 = 8.0, id = 0.0;
    for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
      vec2 g = vec2(float(i), float(j));
      vec2 r = g + sdHash22(ip + g) * 0.85 + 0.075 - fp;
      float d = dot(r, r);
      if (d < d1) { d2 = d1; d1 = d; id = sdHash12(ip + g); } else if (d < d2) d2 = d;
    }
    return vec3(sqrt(d1), sqrt(d2), id);
  }
  float sdWaveAt(vec3 pl) { return uWaveAmp > 0.0 ? texture(uWave, pl.xz * uWaveScale + 0.5).r * uWaveAmp : 0.0; }
`;
const LIQ_PATH = /* glsl */`
  float sdCylExit(vec3 o, vec3 d, float R) {
    float a = dot(d.xz, d.xz);
    if (a < 1e-7) return 1e4;
    float b = dot(o.xz, d.xz), c = dot(o.xz, o.xz) - R * R;
    float disc = b * b - a * c;
    return (-b + sqrt(max(disc, 0.0))) / a;
  }
  // colour of light arriving along a ray that enters the liquid at pl (local)
  // travelling in direction T1 (local, already refracted). s0 = signed distance to surface (<0)
  vec3 sdLiquidPath(vec3 pl, vec3 T1, vec3 Vw, float s0, out float tTot) {
    float R = uRi;
    float tw = sdCylExit(pl, T1, R);
    float dn = dot(uPN, T1);
    float tp = dn > 1e-4 ? -s0 / dn : 1e4;
    float tb = T1.y < -1e-4 ? (pl.y - uYb) / -T1.y : 1e4;
    float t = max(min(tw, min(tp, tb)), 0.0);
    tTot = t;
    vec3 pe = pl + T1 * t;
    float scat = 0.38 + uTurb * 9.0;
    vec3 ext = exp(-(uAbs + scat) * t);
    float blur = 0.6 + uTurb * 3.0;
    vec3 bg;
    if (tw <= tp && tw <= tb) {
      vec3 nO = normalize(vec3(pe.x, 0.0, pe.z));
      vec3 T2 = refract(T1, -nO, 1.33);
      if (dot(T2, T2) < 0.5) {
        bg = sdEnv(normalize(mat3(uModel) * reflect(T1, -nO)), 2.0) * vec3(1.0, 0.55, 0.2) * 0.6;
      } else {
        vec3 pw = (uModel * vec4(pe, 1.0)).xyz;
        vec3 dw = normalize(mat3(uModel) * T2);
        bg = sdSceneAt(pw + dw * 0.9, blur);
      }
    } else if (tp <= tb) {
      vec3 T2 = refract(T1, -uPN, 1.33);
      vec3 pw = (uModel * vec4(pe, 1.0)).xyz;
      vec3 inner = vec3(0.9, 0.42, 0.1) * (uAmb * 2.0 + uSunRad * uSunVisC * 0.15);
      if (dot(T2, T2) < 0.5) bg = inner;
      else bg = mix(inner, sdSceneAt(pw + normalize(mat3(uModel) * T2) * 0.6, blur), 0.5);
    } else {
      vec3 pw = (uModel * vec4(pe, 1.0)).xyz;
      bg = sdSceneAt(pw - vec3(0.0, 0.03, 0.0), blur + 0.8);
    }
    vec3 col = bg * ext;
    // light scattered inside the soda: strong forward lobe when backlit
    float cosT = dot(-uSunDir, Vw);
    float g = 0.6;
    float hg = (1.0 - g * g) / (12.566 * pow(1.0 + g * g - 2.0 * g * cosT, 1.5));
    vec3 scatAmt = (1.0 - exp(-scat * t)) * exp(-uAbs * (0.5 * t + 0.22));
    vec3 sunIn = uSunRad * uSunVisC;
    col += (sunIn * (hg * 4.4 + 0.085) + uAmb * 1.4) * scatAmt;
    return col;
  }
`;

const LIQ_WALL_VERT = /* glsl */`
  varying vec3 vL;
  varying vec3 vW;
  varying vec3 vNW;
  varying vec3 vLN;
  void main() {
    vL = position;
    vLN = normal;
    vec4 w = modelMatrix * vec4(position, 1.0);
    vW = w.xyz;
    vNW = normalize(mat3(modelMatrix) * normal);
    gl_Position = projectionMatrix * viewMatrix * w;
  }
`;
const LIQ_WALL_FRAG = /* glsl */`
  varying vec3 vL;
  varying vec3 vW;
  varying vec3 vNW;
  varying vec3 vLN;
  void main() {
    float s = dot(uPN, vL) - uPD - sdWaveAt(vL);
    if (s > uFoamH) discard;
    vec3 V = normalize(cameraPosition - vW);
    if (s > 0.0) {
      // foam pressed against the glass: a honeycomb of little bubbles
      float rel = s / max(uFoamH, 1e-3);
      vec2 cuv = vec2(atan(vL.z, vL.x) * length(vL.xz), vL.y) / mix(0.014, 0.024, rel) + vec2(0.0, -uTime * (0.4 + 3.0 * uTurb));
      vec3 fc = sdFoamCells(cuv);
      float fw = length(fwidth(cuv));
      float memb = (1.0 - smoothstep(0.0, 0.1 + fw * 0.5, fc.y - fc.x)) * (1.0 - smoothstep(0.25, 0.6, fw));
      vec3 fc2 = sdFoamCells(cuv * 0.33 + 17.0);
      float memb2 = (1.0 - smoothstep(0.0, 0.08 + fw * 0.15, fc2.y - fc2.x)) * (1.0 - smoothstep(0.6, 1.6, fw));
      memb = max(memb, memb2 * 0.8);
      // bubbly top edge: big bubbles stick up out of the foam
      if (rel > 0.75 && fc2.x > 0.55 - (rel - 0.75) * 1.6) discard;
      vec3 alb = mix(vec3(1.0, 0.6, 0.28), vec3(1.0, 0.86, 0.7), smoothstep(0.0, 0.6, rel));
      float big = sdNoise3(vL * 7.0 + vec3(0.0, -uTime * 0.3, 0.0));
      vec3 lit = uFoamAmb * 0.72 + uSunRad * uSunVisC * 0.13;
      vec3 col = alb * lit * (0.7 + 0.25 * smoothstep(0.1, 0.8, fc.x)) * (0.85 + 0.25 * big) + lit * memb * 0.22;
      gl_FragColor = vec4(col, 1.0);
      return;
    }
    vec3 N = normalize(vNW);
    vec3 Nl = normalize(vLN);
    if (uCondOn > 0.5) {
      float theta = atan(vL.z, vL.x);
      vec4 c = texture2D(uCond, vec2(theta / SD_TAU + 0.5, vL.y / 2.25));
      vec2 g = (c.rg * 2.0 - 1.0) * smoothstep(0.35, 0.6, abs(Nl.x) + abs(Nl.z));
      vec3 Tl = vec3(-sin(theta), 0.0, cos(theta));
      vec3 Bl = normalize(cross(Tl, Nl));

    vec3 Vl = normalize(mat3(uInv) * (-V));

    float tt;
    vec3 col = sdLiquidPath(vL, T1, V, min(s, -1e-4), tt);

    col += vec3(1.0, 0.72, 0.42) * (uAmb * 2.5 + uSunRad * uSunVisC * 0.08) * smoothstep(-0.02, 0.0, s);
    gl_FragColor = vec4(col, 1.0);
  }
`;
const LIQ_SURF_VERT = /* glsl */`
  uniform vec3 uSO;
  uniform vec3 uSE1;
  uniform vec3 uSE2;
  varying vec3 vL;
  varying vec3 vW;
  varying vec3 vNL;
  void main() {
    vec3 pl = uSO + uSE1 * position.x * 2.0 + uSE2 * position.y * 2.0;
    float h = sdWaveAt(pl);
    float e = 0.015;
    float hx = sdWaveAt(pl + vec3(e, 0.0, 0.0)) - sdWaveAt(pl - vec3(e, 0.0, 0.0));
    float hz = sdWaveAt(pl + vec3(0.0, 0.0, e)) - sdWaveAt(pl - vec3(0.0, 0.0, e));
    vNL = normalize(uPN - vec3(hx, 0.0, hz) / (2.0 * e));
    pl += uPN * (h + uFoamH);
    vL = pl;
    vec4 w = modelMatrix * vec4(pl, 1.0);
    vW = w.xyz;
    gl_Position = projectionMatrix * viewMatrix * w;
  }
`;
const LIQ_SURF_FRAG = /* glsl */`
  varying vec3 vL;
  varying vec3 vW;
  varying vec3 vNL;
  void main() {
    float rIn = uKind < 0.5 ? sdBottleInnerR(vL.y) : sdCupInnerR(vL.y);
    if (length(vL.xz) > rIn || vL.y < uYb || vL.y > uYTop) discard;
    vec3 V = normalize(cameraPosition - vW);
    vec3 Nw = normalize(mat3(uModel) * vNL);
    if (dot(Nw, V) < 0.0) discard;
    if (uFoamH > 0.004) {
      vec2 cuv = vL.xz / 0.018 + vec2(uTime * 0.1, 0.0);
      vec3 fc = sdFoamCells(cuv);
      float fw = length(fwidth(cuv));
      float memb = (1.0 - smoothstep(0.0, 0.1 + fw * 0.5, fc.y - fc.x)) * (1.0 - smoothstep(0.25, 0.6, fw));
      float ndl = max(dot(Nw, uSunDir), 0.0);
      vec3 lit = uFoamAmb + uSunRad * uSunVisC * (0.1 + 0.35 * ndl);
      vec3 col = vec3(1.0, 0.94, 0.85) * lit * (0.8 + 0.2 * smoothstep(0.1, 0.8, fc.x)) + lit * memb * 0.25;
      gl_FragColor = vec4(col, 1.0);
      return;
    }
    float NdV = max(dot(Nw, V), 0.0);
    float F = sdFres(NdV, 0.02);
    vec3 refl = sdEnv(reflect(-V, Nw), 0.0);
    vec3 Hh = normalize(V + uSunDir);
    vec3 spec = uSunRad * uSunVisC * pow(max(dot(Nw, Hh), 0.0), 900.0) * 60.0;
    vec3 Vl = normalize(mat3(uInv) * (-V));
    vec3 Nl = normalize(vNL);
    vec3 T1 = refract(Vl, Nl, 1.0 / 1.33);
    if (dot(T1, T1) < 0.5) T1 = Vl;
    float tt;
    vec3 thru = sdLiquidPath(vL - Nl * 0.002, T1, V, -0.002, tt);
    vec3 col = thru * (1.0 - F) + refl * F + spec;
    gl_FragColor = vec4(col, 1.0);
  }
`;

const waveN = 32;

// lathe profiles
function bottleGlassProfile() {
  const P = (r, y) => new THREE.Vector2(r, y);
  const pts = [P(0.0, 0.018), P(0.08, 0.014), P(0.17, 0.006), P(0.22, 0.002)];
  for (let i = 0; i <= 7; i++) { const a = -Math.PI / 2 + i / 7 * Math.PI / 2; pts.push(P(0.262 + 0.048 * Math.cos(a), 0.048 + 0.048 * Math.sin(a))); }
  for (let y = 0.08; y < 2.19; y += (y > 1.12 && y < 1.78) ? 0.02 : 0.045) pts.push(P(bottleOuterR(y), y));
  pts.push(P(bottleOuterR(2.20), 2.20), P(bottleOuterR(2.215), 2.215), P(0.1465, 2.232), P(0.148, 2.255), P(0.1475, 2.278));

  return pts;
}
function bottleInnerProfile() {

  for (let i = 0; i <= 6; i++) { const a = -Math.PI / 2 + i / 6 * Math.PI / 2; pts.push(P(0.248 + 0.04 * Math.cos(a), yb + 0.04 + 0.04 * Math.sin(a))); }
  for (let y = yb + 0.06; y < 2.30; y += (y > 1.12 && y < 1.8) ? 0.02 : 0.045) pts.push(P(bottleInnerR(y), y));

}
function cupGlassProfile() {
  const P = (r, y) => new THREE.Vector2(r, y);
  const pts = [P(0.0, 0.006), P(0.15, 0.003), P(0.28, 0.0)];
  for (let i = 0; i <= 6; i++) { const a = -Math.PI / 2 + i / 6 * Math.PI / 2; pts.push(P(0.305 + 0.04 * Math.cos(a), 0.04 + 0.04 * Math.sin(a))); }
  for (let y = 0.07; y < CUP.H - 0.01; y += 0.06) pts.push(P(cupOuterR(y), y));

  for (let y = CUP.H - 0.02; y > CUP.yb + 0.04; y -= 0.06) pts.push(P(cupInnerR(y), y));

}

  const P = (r, y) => new THREE.Vector2(r, y);

/* ------------------------------------------------------------------ *
 *  Liquid volume bookkeeping (volume-conserving plane)
 * ------------------------------------------------------------------ */
function segArea(r, s) {
  if (s >= r) return Math.PI * r * r;
  if (s <= -r) return 0;
  return r * r * Math.acos(-s / r) + s * Math.sqrt(r * r - s * s);
}
function makeVessel(innerR, y0, y1, n) {

  return { ys, rs, dy, n, y0, y1 };
}
function vesselVolume(v, nx, ny, nz, d) {
  const m = Math.hypot(nx, nz);

    return V * v.dy;

  for (let i = 0; i < v.n; i++) V += segArea(v.rs[i], (d - ny * v.ys[i]) / m);

}
function solvePlaneD(v, n, target) {

  const m = Math.hypot(n.x, n.z);
  for (let i = 0; i < v.n; i += 4) {
    const c = n.y * v.ys[i];
    lo = Math.min(lo, c - m * v.rs[i]);
    hi = Math.max(hi, c + m * v.rs[i]);

}

  pour.q += (q - pour.q) * (1 - Math.exp(-dt * 14));
  pour.foamQ = fq;
  const flow = pour.q;
  if (flow > 1e-5) {
    state.botV = Math.max(0, state.botV - flow * dt);
    const room = 0.335 - state.cupV;
    state.cupV = Math.min(0.335, state.cupV + flow * dt * 0.98);
    if (room < flow * dt) addWet(CUP_POS.x + (Math.random() - 0.5) * 0.9, CUP_POS.z + (Math.random() - 0.5) * 0.9, 0.12, 0.6, 1);
    // the pour knocks a foam head up in the cup; a freshly opened soda foams more
    pour.fizz = Math.max(pour.fizz, 0.4 + state.turb);
    state.cupFoamVol += flow * dt * (0.12 + 0.32 * pour.fizz);
    state.cupTurb = Math.min(1, state.cupTurb + flow * dt * 9);
  }
  if (fq > 0) { state.foamVol -= fq * dt; state.cupFoamVol += fq * dt * 0.9; }
  // stream geometry: a falling sheet of soda from the lip to the surface in the cup
  _mW.copy(_mL).applyMatrix4(bottleRoot.matrixWorld);
  const vmag = clamp(Math.sqrt(2 * GRAV * Math.max(head, 0)) * 0.45, 0.5, 2.6);
  _v0.set(0, 1, 0).applyQuaternion(bottleRoot.quaternion).multiplyScalar(vmag);
  const surfY = CUP_POS.y + (state.cupV > 1e-4 ? cupLiq.uni.uPD.value + state.cupFoam * 0.5 : CUP.yb);
  const targetR = clamp(Math.sqrt(Math.max(flow, 0) / (Math.PI * Math.max(vmag, 0.5))) * 0.7, 0, 0.055);
  pour.r += (targetR - pour.r) * (1 - Math.exp(-dt * 10));
  streamMesh.visible = pour.r > 0.002;
  if (!streamMesh.visible) return;
  // time of flight to the surface
  const a = -0.5 * GRAV, b = _v0.y, c = _mW.y - surfY;
  const disc = b * b - 4 * a * c;
  const tHit = disc > 0 ? (-b - Math.sqrt(disc)) / (2 * a) : 0.2;
  let k = 0;
  for (let i = 0; i <= STREAM_SEG; i++) {
    const u = i / STREAM_SEG;
    const t = tHit * u;
    _sp.set(_mW.x + _v0.x * t, _mW.y + _v0.y * t - 0.5 * GRAV * t * t, _mW.z + _v0.z * t);
    _sv.set(_v0.x, _v0.y - GRAV * t, _v0.z);
    const speed = _sv.length();
    _st.copy(_sv).normalize();
    _sn.set(0, 1, 0).cross(_st);
    if (_sn.lengthSq() < 1e-6) _sn.set(1, 0, 0);
    _sn.normalize();
    _sb.crossVectors(_st, _sn).normalize();
    // thins as it speeds up; ripples run down it
    let r = pour.r * Math.sqrt(vmag / Math.max(speed, vmag)) * (1 + 0.12 * Math.sin(u * 22 - pour.t * 30) + 0.06 * Math.sin(u * 47 - pour.t * 51));
    r *= smooth(0, 0.06, u) * 0.5 + 0.5;
    for (let j = 0; j <= STREAM_RAD; j++) {
      const ang = j / STREAM_RAD * TAU;
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const nx = _sn.x * ca + _sb.x * sa, ny = _sn.y * ca + _sb.y * sa, nz = _sn.z * ca + _sb.z * sa;
      const flat = 1 + 0.35 * u;  // the stream flattens into a ribbon a bit
      sPos[k * 3] = _sp.x + (_sn.x * ca * flat + _sb.x * sa / flat) * r;
      sPos[k * 3 + 1] = _sp.y + (_sn.y * ca * flat + _sb.y * sa / flat) * r;
      sPos[k * 3 + 2] = _sp.z + (_sn.z * ca * flat + _sb.z * sa / flat) * r;
      sNor[k * 3] = nx; sNor[k * 3 + 1] = ny; sNor[k * 3 + 2] = nz;
      sAux[k * 2] = r; sAux[k * 2 + 1] = u;
      k++;
    }
  }
  streamGeo.attributes.position.needsUpdate = true;
  streamGeo.attributes.normal.needsUpdate = true;
  streamGeo.attributes.aux.needsUpdate = true;
  // where the stream punches into the cup: entrained bubbles
  pour.hitL.copy(_sp).applyMatrix4(U.uCupInv.value);
  if (state.cupV > 0.002 && flow > 0.004) {
    const n = flow * dt * 9000 * (Q.key === 'high' ? 1 : 0.6);
    for (let i = 0; i < n; i++) {
      const rr = Math.sqrt(bubRand()) * 0.08, aa = bubRand() * TAU;
      const x = clamp(pour.hitL.x + Math.cos(aa) * rr, -0.3, 0.3), z = clamp(pour.hitL.z + Math.sin(aa) * rr, -0.3, 0.3);
      const y = Math.max(CUP.yb + 0.01, cupLiq.uni.uPD.value - 0.02 - bubRand() * 0.25);
      cupBubbles.spawn(x, y, z, 0.0015 + Math.pow(bubRand(), 2) * 0.007, (bubRand() - 0.5) * 0.6, -0.4 - bubRand() * 1.2, (bubRand() - 0.5) * 0.6, 6, 0);
    }
  }
}

/* ------------------------------------------------------------------ *
 *  Pointer interaction
 * ------------------------------------------------------------------ */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const capProxy = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.22, 16), new THREE.MeshBasicMaterial());
capProxy.position.y = 0.04;
capProxy.visible = false;
capGroup.add(capProxy);
function pick(e) {
  const r = canvasEl.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  bottleRoot.updateMatrixWorld(true);
  capGroup.updateMatrixWorld(true);
  if (state.capOn && capGroup.parent === bottlePose && raycaster.intersectObject(capProxy, false).length) return 'cap';
  if (raycaster.intersectObject(bottleGlassFront, false).length) return 'bottle';
  return null;
}
let drag = null;
canvasEl.addEventListener('pointerdown', (e) => {
  if (demo.active) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const what = pick(e);
  if (!what) return;
  drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, what, moved: false, t0: performance.now() };
  controls.enabled = false;
  canvasEl.setPointerCapture(e.pointerId);
  canvasEl.style.cursor = 'grabbing';
});
canvasEl.addEventListener('pointermove', (e) => {
  if (!drag) {
    if (e.pointerType === 'mouse' && !(e.buttons & 2) && !demo.active) {
      const w = pick(e);
      canvasEl.style.cursor = w === 'cap' ? 'pointer' : w === 'bottle' ? 'grab' : 'default';
    }
    return;
  }
  if (e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx, dy) > 6) drag.moved = true;
  if (!drag.moved) return;
  const dist = camera.position.distanceTo(bottleRoot.position) + 0.5;
  const upp = 2 * dist * Math.tan(camera.fov * DEG / 2) / innerHeight;
  bottle.held = true;
  bottle.shakeCmd = clamp(dx * upp, -1.3, 1.3);
  bottle.pourCmd = clamp((dy - 18) / 230, 0, 1);
});
function endDrag(e) {
  if (!drag || e.pointerId !== drag.id) return;
  if (!drag.moved && drag.what === 'cap' && e.type === 'pointerup') openCap();
  drag = null;
  bottle.held = false;
  bottle.shakeCmd = 0;
  bottle.pourCmd = 0;
  controls.enabled = true;
  canvasEl.style.cursor = 'default';
}
canvasEl.addEventListener('pointerup', endDrag);
canvasEl.addEventListener('pointercancel', endDrag);

/* ------------------------------------------------------------------ *
 *  Controls (right drag = orbit, wheel = zoom; left is for the bottle)
 * ------------------------------------------------------------------ */
const controls = new OrbitControls(camera, canvasEl);
controls.target.copy(HERO.target);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.rotateSpeed = 0.6;
controls.zoomSpeed = 0.8;
controls.minDistance = 2.4;
controls.maxDistance = 14;
controls.minPolarAngle = 12 * DEG;
controls.maxPolarAngle = 87 * DEG;
controls.mouseButtons = { LEFT: -1, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_ROTATE };
controls.update();

const demo = { active: false, t: 0 };


/* ------------------------------------------------------------------ *
 *  UI: toast, gauge, reset, quality, demo
 * ------------------------------------------------------------------ */
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function toast(msg, ms = 1800) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), ms);
}
const gaugeFill = document.getElementById('gaugeFill');
const gaugeLabel = document.getElementById('gaugeLabel');
let gaugeShown = -1, gaugeText = '';
function updateGauge() {
  const v = state.capOn ? state.shake : 0;
  if (Math.abs(v - gaugeShown) > 0.004) { gaugeFill.style.width = (v * 100).toFixed(1) + '%'; gaugeShown = v; }
  const txt = state.capOn ? (state.shake > 0.85 ? '气压 · 满' : '气压') : '已开盖';
  if (txt !== gaugeText) { gaugeLabel.textContent = txt; gaugeText = txt; }
}

function resetScene(animate) {
  Object.assign(state, { botV: BOTTLE_FULL, cupV: 0, capOn: true, shake: 0, agit: 0, foamIn: 0, foamVol: 0, turb: 0, cupFoam: 0, cupFoamVol: 0, cupTurb: 0 });
  state.botN.set(0, 1, 0);
  Object.assign(slosh, { tx: 0, tz: 0, vx: 0, vz: 0, energy: 0 });
  wave.h.fill(0); wave.v.fill(0);
  Object.assign(erupt, { active: false, t: 0, inten: 0, power: 0, emitAcc: 0, qout: 0 });
  Object.assign(pour, { q: 0, foamQ: 0, r: 0, fizz: 0 });
  streamMesh.visible = false;
  foam.n = 0; spray.n = 0; vapor.n = 0;
  botBubbles.clear(); cupBubbles.clear();
  resetCap();
  drag = null;
  Object.assign(bottle, { held: false, shakeCmd: 0, pourCmd: 0, pourA: 0, lift: 0, swing: 0, swingV: 0, swingB: 0, swingBV: 0, liqInit: false, arrive: animate ? 0 : 1 });
  bottle.hand.set(0, HOLD_Y + (animate ? 1.1 : 0), 0);
  bottle.handVel.set(0, 0, 0); bottle.prevHandVel.set(0, 0, 0); bottle.liqAcc.set(0, 0, 0);
  wetQueue.length = 0;
  condensationRing();
  flushWet(true);
  pourHintShown = false;
}
let pourHintShown = false;

let userPickedQuality = false;
function setQuality(key, silent) {
  if (Q.key === key) return;
  Q = QUALITY[key];
  sun.shadow.mapSize.set(Q.shadow, Q.shadow);
  if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
  makeCausticTargets();
  onResize();
  captureEnv();
  while (foam.n > Q.foam) killFoam(foam.n - 1);
  document.getElementById('quality').textContent = '画质 · ' + Q.name;
  if (!silent) toast('画质：' + Q.name + (key === 'high' ? '（MSAA · 2K 阴影 · 精细焦散）' : '（更流畅）'));
}
function toggleQuality() { userPickedQuality = true; setQuality(Q.key === 'high' ? 'medium' : 'high'); }

// ---- demo: a 17 s take for screen recording ----
const easeIO = (u) => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const DEMO_LEN = 17;
const _dt = new V3(), _dp = new V3();
const DEMO_POUR_T = new V3(0.72, 1.05, -0.18), DEMO_CUP_T = new V3(1.3, 0.62, -0.4);
function startDemo() {
  resetScene(false);
  demo.active = true;
  demo.t = 0;
  demo.opened = false;
  controls.enabled = false;
  toast('演示开始', 1200);
}
function demoCamera(t) {
  let target, dist, polar, az;
  if (t < 3) {
    const u = easeIO(t / 3);
    target = HERO.target; dist = HERO.dist * (1.06 - 0.06 * u);
    polar = HERO.polar - 0.07 * Math.sin(Math.PI * u);
    az = HERO.az - Math.PI * (1 - u);
  } else if (t < 11) {
    const u = smooth(3, 7, t);
    target = HERO.target; dist = HERO.dist * (1 - 0.04 * u); polar = HERO.polar; az = HERO.az;
  } else if (t < 15) {
    const u = easeIO(smooth(11, 12.4, t));
    target = _dt.copy(HERO.target).lerp(DEMO_POUR_T, u);
    dist = lerp(HERO.dist * 0.96, 6.4, u); polar = lerp(HERO.polar, 74 * DEG, u); az = lerp(HERO.az, 6 * DEG, u);
  } else {
    const u = easeIO(smooth(15, DEMO_LEN, t));
    target = _dt.copy(DEMO_POUR_T).lerp(DEMO_CUP_T, u);
    dist = lerp(6.4, 4.4, u); polar = lerp(74 * DEG, 77 * DEG, u); az = lerp(6 * DEG, 10 * DEG, u);
  }
  camFromSph(target, dist * viewScale, polar, az);
  camera.lookAt(target);
  controls.target.copy(target);
}
function updateDemo(dt) {
  if (!demo.active) return;
  demo.t += dt;
  const t = demo.t;
  // shake hard from 3 to 6.8 s
  if (t >= 3 && t < 6.8) {
    const k = smooth(3, 3.35, t) * (1 - smooth(6.45, 6.8, t));
    bottle.held = true;
    bottle.shakeCmd = k * 0.62 * Math.sin((t - 3) * TAU * 3.3);
    bottle.pourCmd = 0;
  } else if (t >= 6.8 && t < 11) {
    bottle.held = false; bottle.shakeCmd = 0; bottle.pourCmd = 0;
  }
  if (t >= 7 && !demo.opened) { demo.opened = true; state.shake = Math.max(state.shake, 0.92); openCap(); }
  // pour from 11 to 15 s
  if (t >= 11 && t < 15) {
    bottle.held = true; bottle.shakeCmd = 0;
    bottle.pourCmd = smooth(11, 11.9, t) * (1 - smooth(14.2, 15, t));
  } else if (t >= 15) {
    bottle.held = false; bottle.pourCmd = 0;
  }
  if (t >= DEMO_LEN) {
    demo.active = false;
    controls.enabled = true;
    controls.update();
  }
}

document.getElementById('reset').addEventListener('click', () => { demo.active = false; controls.enabled = true; resetScene(true); toast('换了一瓶新的', 1200); });
document.getElementById('quality').addEventListener('click', toggleQuality);
document.getElementById('demo').addEventListener('click', startDemo);
window.addEventListener('keydown', (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === 'h') document.body.classList.toggle('hide-ui');
  else if (k === 'd') startDemo();
  else if (k === 'q') toggleQuality();
});
if (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) {
  document.getElementById('hint').innerHTML = '<b>单指左右拖瓶子</b> 摇晃<i>/</i><b>点瓶盖</b> 开盖<i>/</i><b>往下拖</b> 倒进杯子<i>/</i><b>拖空白处</b> 旋转<i>/</i><b>双指</b> 缩放';
}

/* ------------------------------------------------------------------ *
 *  Frame
 * ------------------------------------------------------------------ */
const clock = new THREE.Clock();
let simTime = 0;

function render() {
  camera.updateMatrixWorld();
  U.uViewProj.value.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  PX_SCALE.value = Hh / (2 * Math.tan(camera.fov * DEG / 2));
  DOF.value.x = camera.position.distanceTo(_tmp.set(bottleRoot.position.x, 1.0, bottleRoot.position.z));

  if (foam.n) { foamLighting(); }
  uploadFoam();
  flushWet(false);
  renderCaustics();
  renderFoamSurface();
  renderer.setRenderTarget(mainRT);
  renderer.setClearColor(0x000000, 1);
  renderer.clear(true, true, false);
  renderer.shadowMap.needsUpdate = true;
  renderer.render(opaqueScene, camera);
  copyScene();
  // far container first, so the nearer one can see it through its refraction
  const dB = camera.position.distanceToSquared(bottleRoot.position);
  const dC = camera.position.distanceToSquared(cupRoot.position);
  const order = dB > dC ? [bottleScene, cupScene] : [cupScene, bottleScene];
  renderer.setRenderTarget(mainRT);
  renderer.render(order[0], camera);
  copyScene();
  renderer.setRenderTarget(mainRT);
  renderer.render(order[1], camera);
  if (sprayGeo.instanceCount > 0 || vaporGeo.instanceCount > 0) renderer.render(fxScene, camera);
  renderBloom();
  finalMat.uniforms.tScene.value = mainRT.texture;
  fsPass(finalMat, null);
}

function step(dtAll) {
  const n = Math.max(1, Math.ceil(dtAll / (1 / 60) - 1e-6));
  for (let i = 0; i < n; i++) stepOnce(dtAll / n);
}
function stepOnce(dt) {
  simTime += dt;
  U.uTime.value = simTime;
  updateDemo(dt);
  if (!demo.active && bottle.pourA > 0.45 && state.capOn && !pourHintShown) { pourHintShown = true; toast('瓶盖还没开，先点一下瓶盖', 2200); }
  updateBottle(dt);
  U.uBotInv.value.copy(bottleRoot.matrixWorld).invert();
  updateSlosh(dt);
  updateFizz(dt);
  updateEruption(dt);
  updatePour(dt);
  updateCupFoam(dt);
  updateLiquids();
  updateBubbles(dt);
  updateFoam(dt);
  updateSpray(dt);
  updateVapor(dt);
  updateCap(dt);
}

let frames = 0, fpsAcc = 0, fpsVal = 0, autoChecks = 0, testPause = false;
function tick() {
  const raw = clock.getDelta();
  const dt = Math.min(raw, 1 / 20);
  fpsAcc += raw; frames++;
  if (fpsAcc > 1) {
    fpsVal = frames / fpsAcc; frames = 0; fpsAcc = 0;
    // a slow integrated GPU gets the lighter preset automatically (once)
    autoChecks++;
    if (autoChecks >= 3 && autoChecks <= 6 && !userPickedQuality && Q.key === 'high' && fpsVal < 38) {
      setQuality('medium', true);
      toast('自动切换到中画质（按 Q 可切回）', 2600);
      autoChecks = 99;
    }
  }
  if (!demo.active) controls.update();
  if (!testPause) step(dt);
  if (demo.active) demoCamera(demo.t);
  updateGauge();
  render();
  requestAnimationFrame(tick);
}

function onResize() {
  fitCamera();
  controls.maxDistance = 14 * viewScale;
  renderer.setPixelRatio(Q.pr);
  renderer.setSize(innerWidth, innerHeight);
  makeTargets();
  makeFoamTargets();
}
window.addEventListener('resize', onResize);

/* ------------------------------------------------------------------ */
onResize();
makeCausticTargets();
condensationRing();
flushWet(true);
updateBottle(1 / 60);
updateLiquids();
renderCaustics();
captureEnv();
window.__soda = {
  ready: true, state, camera, controls, renderer, bottle, slosh, erupt,
  fps: () => fpsVal,
  // test helper: advance the simulation without rendering every step
  advance(sec, dt = 1 / 60) { for (let t = 0; t < sec; t += dt) step(dt); },
  run(sec, fn, dt = 1 / 60) { for (let t = 0; t < sec; t += dt) { fn(t); step(dt); } },
  setDrag(x, pour) { bottle.held = true; bottle.shakeCmd = x; bottle.pourCmd = pour; },
  release() { bottle.held = false; bottle.shakeCmd = 0; bottle.pourCmd = 0; },
  open: () => openCap(),
  demo: () => startDemo(),
  demoState: () => ({ active: demo.active, t: demo.t }),
  stepFrame: (dt) => { step(dt); if (demo.active) demoCamera(demo.t); },
  setQuality: (k) => setQuality(k),
  noAuto: () => { userPickedQuality = true; },
  pause: (v) => { testPause = v; },
  project: (x, y, z) => { const v = new V3(x, y, z).project(camera); return { x: (v.x * 0.5 + 0.5) * innerWidth, y: (-v.y * 0.5 + 0.5) * innerHeight }; },
  bottlePos: () => bottleRoot.position.clone(),
  capOn: () => state.capOn,
  quality: () => Q.key,
  uiHidden: () => document.body.classList.contains('hide-ui'),
  camPos: () => camera.position.clone(),
  timeSteps: (n, dt = 1 / 60) => { const t0 = performance.now(); for (let i = 0; i < n; i++) step(dt); return (performance.now() - t0) / n; },
  timeRender: (n) => { const t0 = performance.now(); for (let i = 0; i < n; i++) { if (foam.n) foamLighting(); uploadFoam(); } return (performance.now() - t0) / n; },
  pourState: () => ({ q: pour.q, cupV: state.cupV, botV: state.botV, cupFoam: state.cupFoam, tilt: bottle.tilt }),
  foamCount: () => foam.n,
};
requestAnimationFrame(() => {
  tick();
  setTimeout(() => document.getElementById('loading').classList.add('done'), 200);
});
</script>
</body>
